// The app around libmain.so (KisakCOD-mp). Properties, all given by
// scripts/platform/android/build_apk.py:
//   kisakJniLibs  folder holding <kisakAbi>/ with libmain.so, libSDL3.so,
//                 libopenal.so and libd3d9_unavailable.so
//   kisakAbi      arm64-v8a (devices, the default) or x86_64 (the emulator)
//   kisakSdlJava  SDL3's Java sources (android-project/app/src/main/java of
//                 the pinned SDL3 checkout), compiled into the app unchanged
//   kisakVersionName, kisakVersionCode  shown in Android's app settings
plugins {
    id 'com.android.application'
}

def required = { name ->
    if (!project.hasProperty(name)) {
        throw new GradleException("missing -P${name}: build the APK with scripts/platform/android/build_apk.py")
    }
    return project.property(name)
}

android {
    namespace = 'org.kisakcod.game'
    compileSdk = 35
    defaultConfig {
        applicationId = 'org.kisakcod.game'
        minSdk = 29
        targetSdk = 35
        versionCode = (project.findProperty('kisakVersionCode') ?: '1') as int
        versionName = project.findProperty('kisakVersionName') ?: 'dev'
        ndk {
            abiFilters(project.findProperty('kisakAbi') ?: 'arm64-v8a')
        }
    }
    sourceSets.main {
        java.srcDirs += required('kisakSdlJava')
        jniLibs.srcDirs = [required('kisakJniLibs')]
    }
    packaging {
        jniLibs {
            // Uncompressed and page aligned, so Android maps the libraries
            // straight out of the APK.
            useLegacyPackaging = false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError = false
    }
}
