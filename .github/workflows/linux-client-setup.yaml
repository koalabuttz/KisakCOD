name: Linux client setup tool

# scripts/tools/setup_linux_client.py builds a playable x86_64 multiplayer
# client in one command: it fetches SDL3 and DXVK Native at the pinned
# revisions, applies the DXVK fix that fullscreen on Wayland needs, builds the
# client and packs it into a folder. This workflow runs the tool for real
# (network fetches, both SDK builds, the client, the packed folder) and starts
# the result. That takes a full client build, so it runs only when the tool,
# the packing tool or this file changes, and on request; the Linux workflow
# runs the tool's network-free self-test on every pull request.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - scripts/tools/setup_linux_client.py
      - scripts/tools/package_linux_client.py
      - scripts/tests/test_setup_linux_client.py
      - .github/workflows/linux-client-setup.yaml
  push:
    branches: [master]
    paths:
      - scripts/tools/setup_linux_client.py
      - scripts/tools/package_linux_client.py
      - scripts/tests/test_setup_linux_client.py
      - .github/workflows/linux-client-setup.yaml

# A newer push to the same pull request replaces the run in progress. A run on
# master that is in progress finishes; of the ones waiting behind it only the
# newest is kept. Manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: this job only checks out and builds.
permissions:
  contents: read

jobs:
  setup:
    name: One-command setup builds and packs the x86_64 client
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Self-test the tool
        shell: bash
        run: python3 scripts/tests/test_setup_linux_client.py

      - name: The tool names the packages a bare runner is missing
        shell: bash
        run: |
          set -euo pipefail
          # Before anything is installed the runner has no meson. The tool must
          # stop there, say which package to install, and write nothing.
          if command -v meson >/dev/null; then
            echo "meson is already installed on this runner image; nothing to check here"
            exit 0
          fi
          if python3 scripts/tools/setup_linux_client.py --prefix "$RUNNER_TEMP/never" \
              > "$RUNNER_TEMP/missing.log" 2>&1; then
            cat "$RUNNER_TEMP/missing.log"
            echo "the tool went on without meson" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/missing.log"
          grep -F 'package meson' "$RUNNER_TEMP/missing.log"
          grep -F 'sudo apt install' "$RUNNER_TEMP/missing.log"
          test ! -e "$RUNNER_TEMP/never"

      - name: Install the packages the tool asks for
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # No desktop headers: SDL3 is built with --sdl-console-build below,
          # which is enough to start the client as far as --version.
          scripts/ci/apt-install.sh \
            clang cmake git glslang-tools libopenal-dev meson ninja-build pkg-config

      - name: Build SDL3, the fixed DXVK and the client, and pack the folder
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tools/setup_linux_client.py \
            --prefix "$RUNNER_TEMP/kisak-sdk" \
            --build-dir "$RUNNER_TEMP/mp-x64" \
            --package "$RUNNER_TEMP/KisakCOD-linux" \
            --sdl-console-build

      - name: The DXVK it built is the pinned revision plus the Wayland fix
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/kisak-sdk/src/dxvk"
          test "$(git -C "$source" rev-parse HEAD)" = c3dd74be6baec53786d4e064a572185b70347a17
          # The fix is one change to the SDL3 window code and nothing else.
          test "$(git -C "$source" diff --name-only)" = src/wsi/sdl3/wsi_window_sdl3.cpp
          git -C "$source" diff | tee "$RUNNER_TEMP/dxvk-fix.diff"
          # 2.7.1 gave up when the window could not be positioned; the fix only warns.
          grep -F -- '-      return false;' "$RUNNER_TEMP/dxvk-fix.diff"
          grep -F -- '+      Logger::warn(str::format("SDL3 WSI: enterFullscreenMode: SDL_SetWindowPosition: "' \
            "$RUNNER_TEMP/dxvk-fix.diff"
          # The built library carries that warning, so it was built from the fixed file.
          grep -a -c -F 'SDL3 WSI: enterFullscreenMode: SDL_SetWindowPosition: ' \
            "$RUNNER_TEMP/kisak-sdk/dxvk/lib/libdxvk_d3d9.so.0"

      - name: The packed folder holds SDL3 and DXVK and starts with no library path
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/KisakCOD-linux"
          cat "$package/MANIFEST.txt"
          test -f "$package/lib/libSDL3.so.0"
          test -f "$package/lib/libdxvk_d3d9.so.0"
          test -f "$package/licenses/SDL3.txt"
          test -f "$package/licenses/DXVK.txt"
          test -f "$package.tar.gz"
          readelf -d "$package/KisakCOD-mp" | tee "$RUNNER_TEMP/dynamic.txt"
          grep -F 'Library runpath: [$ORIGIN/lib]' "$RUNNER_TEMP/dynamic.txt"
          # Built without movies: a packed folder must not need this runner's FFmpeg.
          ! grep -E 'NEEDED.*libav(codec|util)' "$RUNNER_TEMP/dynamic.txt"
          # A made-up, empty game folder: --version stops before any game file is read.
          mkdir -p "$RUNNER_TEMP/empty-game/main" "$RUNNER_TEMP/empty-game/zone"
          # Away from the SDK: only the folder's own lib/ can satisfy SDL3 and DXVK.
          mv "$RUNNER_TEMP/kisak-sdk" "$RUNNER_TEMP/kisak-sdk-moved"
          env -u LD_LIBRARY_PATH "$package/run-mp.sh" --game "$RUNNER_TEMP/empty-game" --version
          mv "$RUNNER_TEMP/kisak-sdk-moved" "$RUNNER_TEMP/kisak-sdk"

      - name: A second run rebuilds nothing in the SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tools/setup_linux_client.py \
            --prefix "$RUNNER_TEMP/kisak-sdk" \
            --build-dir "$RUNNER_TEMP/mp-x64" \
            --sdl-console-build --sdk-only | tee "$RUNNER_TEMP/second.log"
          grep -F 'SDL3 is up to date' "$RUNNER_TEMP/second.log"
          grep -F 'DXVK is up to date' "$RUNNER_TEMP/second.log"
          ! grep -E '^\+ ' "$RUNNER_TEMP/second.log"
