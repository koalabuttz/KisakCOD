name: Windows CMake DirectX Build

on:
  workflow_dispatch:
    inputs:
      tracy:
        # For a profiling run on a Windows PC: the Win32 Release and x64
        # executables of this run carry the Tracy profiler (KISAK_WIN_TRACY),
        # and their artifact names end in -Tracy. ARM64 stays without it.
        description: 'Build the Win32 and x64 games with the Tracy profiler'
        type: boolean
        default: false
  # Changes that cannot affect the Windows builds skip this workflow. The path
  # list is the same for both events, and the order matters: a later pattern
  # overrides an earlier one. scripts/tests/test_linux_window_workflow.py checks it.
  push:
    branches: [ "master" ]
    paths:
      - '**'
      # Nothing below reaches the MSVC builds or the regression checks: the
      # documentation, and the native Linux and macOS ports' own sources, tests,
      # CMake, script and workflows (shared sources include src/linux headers
      # only in Linux and macOS builds).
      - '!docs/**'
      - '!**/*.md'
      - '!src/linux/**'
      # ...except the Bink shim, which 64-bit Windows movies build from.
      - 'src/linux/client/cinematic/**'
      - '!tests/linux_*/**'
      - '!tests/skinning/**'
      # ...nor the PS Vita port's own sources, tests and CMake (shared sources
      # include its headers only in Vita builds), nor the test machines' run
      # scripts and their stand-in game.
      - '!src/vita/**'
      - '!src/gfx_gxm/**'
      - '!tests/vita_*/**'
      - '!scripts/platform/vita/**'
      - '!scripts/runs/**'
      - '!tests/runs/**'
      - '!scripts/platform/linux/**'
      - '!build-linux.sh'
      - '!.github/workflows/build-kisakcod-linux.yaml'
      - '!.github/workflows/build-kisakcod-macos.yaml'
      # scripts/tests holds the Linux runners too. Only the scripts and the
      # D3DX project this workflow runs are its own; add any new one here.
      - '!scripts/tests/**'
      - 'scripts/tests/d3dx/**'
      - 'scripts/tests/test_renderer_command_ownership.py'
      - 'scripts/tests/test_script_vm_field_stack.py'
      - 'scripts/tests/test_shader_constant_order.py'
      - 'scripts/tests/test_shellshock_channel_metadata.py'
      - 'scripts/tests/test_script_loading_watchdog.py'
      - 'scripts/tests/test_vulkan_legacy_shaders.py'
      - 'scripts/tools/shader_spike/**'
      - 'scripts/tests/test_voice_lifecycle.py'
      - 'scripts/tests/test_script_console_watchdog.py'
      - 'scripts/tests/test_exec_command_ownership.py'
      - 'scripts/tests/check_rhi_boundary.py'
      - 'scripts/tests/test_rhi_boundary.py'
      - 'scripts/tests/rhi_boundary_allowlist.txt'
      - 'scripts/tests/test_windows_tracy_option.py'
      - 'scripts/tests/test_windows_vulkan_backend_option.py'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "master" ]
    paths:
      - '**'
      # Nothing below reaches the MSVC builds or the regression checks: the
      # documentation, and the native Linux and macOS ports' own sources, tests,
      # CMake, script and workflows (shared sources include src/linux headers
      # only in Linux and macOS builds).
      - '!docs/**'
      - '!**/*.md'
      - '!src/linux/**'
      # ...except the Bink shim, which 64-bit Windows movies build from.
      - 'src/linux/client/cinematic/**'
      - '!tests/linux_*/**'
      - '!tests/skinning/**'
      # ...nor the PS Vita port's own sources, tests and CMake (shared sources
      # include its headers only in Vita builds), nor the test machines' run
      # scripts and their stand-in game.
      - '!src/vita/**'
      - '!src/gfx_gxm/**'
      - '!tests/vita_*/**'
      - '!scripts/platform/vita/**'
      - '!scripts/runs/**'
      - '!tests/runs/**'
      - '!scripts/platform/linux/**'
      - '!build-linux.sh'
      - '!.github/workflows/build-kisakcod-linux.yaml'
      - '!.github/workflows/build-kisakcod-macos.yaml'
      # scripts/tests holds the Linux runners too. Only the scripts and the
      # D3DX project this workflow runs are its own; add any new one here.
      - '!scripts/tests/**'
      - 'scripts/tests/d3dx/**'
      - 'scripts/tests/test_renderer_command_ownership.py'
      - 'scripts/tests/test_script_vm_field_stack.py'
      - 'scripts/tests/test_shader_constant_order.py'
      - 'scripts/tests/test_shellshock_channel_metadata.py'
      - 'scripts/tests/test_script_loading_watchdog.py'
      - 'scripts/tests/test_vulkan_legacy_shaders.py'
      - 'scripts/tools/shader_spike/**'
      - 'scripts/tests/test_voice_lifecycle.py'
      - 'scripts/tests/test_script_console_watchdog.py'
      - 'scripts/tests/test_exec_command_ownership.py'
      - 'scripts/tests/check_rhi_boundary.py'
      - 'scripts/tests/test_rhi_boundary.py'
      - 'scripts/tests/rhi_boundary_allowlist.txt'
      - 'scripts/tests/test_windows_tracy_option.py'
      - 'scripts/tests/test_windows_vulkan_backend_option.py'

# A newer push to a pull request cancels that pull request's older run, and a
# newer push to master cancels an older master run (the newer one checks
# everything merged so far). Manual runs get a group of their own and always
# finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out, build and upload artifacts.
permissions:
  contents: read

jobs:
  runtime-regressions:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Runtime regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Renderer command ownership
        run: python3 scripts/tests/test_renderer_command_ownership.py
      - name: Entity field evaluation stack
        run: python3 scripts/tests/test_script_vm_field_stack.py
      - name: Shader constant ordering
        run: python3 scripts/tests/test_shader_constant_order.py
      - name: Dedicated shellshock sound channels
        run: python3 scripts/tests/test_shellshock_channel_metadata.py
      - name: Script loading watchdog
        run: python3 scripts/tests/test_script_loading_watchdog.py
      - name: Optional voice lifecycle
        run: python3 scripts/tests/test_voice_lifecycle.py
      - name: Script console I/O watchdog
        run: python3 scripts/tests/test_script_console_watchdog.py
      - name: Config command ownership
        run: python3 scripts/tests/test_exec_command_ownership.py
      - name: Renderer graphics interface boundary
        # Only src/gfx_d3d/rhi calls Direct3D 9 (renderer plan M1a); the test also
        # runs the check on this checkout.
        run: python3 scripts/tests/test_rhi_boundary.py
      - name: Windows Tracy profiler option
        run: python3 scripts/tests/test_windows_tracy_option.py
      - name: Windows Vulkan back end option
        run: python3 scripts/tests/test_windows_vulkan_backend_option.py
      - name: MSVC x64 census summarizer
        run: python3 scripts/ci/test_summarize_msvc_x64.py

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build with DirectX SDK
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_PKG: Microsoft.DXSDK.D3DX
      DXSDK_VER: 9.29.952.8
      # Vulkan-Headers v1.3.296, as the vulkan-probe job
      VULKAN_HEADERS_REVISION: 29f979ee5aa58b7b005f805ea8df7a855c39ff37

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK (for nuget usage)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore DXSDK NuGet package
        run: |
          dotnet new classlib -o dxsdk-temp
          cd dxsdk-temp
          dotnet add package $env:DXSDK_PKG --version $env:DXSDK_VER
          cd ..
      
      - name: Extract DXSDK paths from NuGet
        id: dxsdk
        shell: powershell
        run: |
          $pkgPath = Join-Path "${env:NUGET_PACKAGES}" "$env:DXSDK_PKG\$env:DXSDK_VER"
          $libDir = Join-Path $pkgPath "build\native\release\lib\x86"
          $incDir = Join-Path $pkgPath "build\native\include"
          $sdkDir = Join-Path $pkgPath "build\native"
          echo "libDir=$libDir" >> $env:GITHUB_ENV
          echo "incDir=$incDir" >> $env:GITHUB_ENV
          echo "DXSDK_DIR_NUGET=$pkgPath" >> $env:GITHUB_ENV
          echo "DXSDK_DIR=$sdkDir" >> $env:GITHUB_ENV
          Write-Host $pkgPath
          Write-Host $libDir
          Write-Host $incDir
          Write-Host $sdkDir

      - name: Install latest CMake
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # the "latest" branch on 2026-11-05

      - name: Fetch the pinned Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/Vulkan-Headers"
          git init "$dst"
          git -C "$dst" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$dst" fetch --depth 1 origin "$VULKAN_HEADERS_REVISION"
          git -C "$dst" checkout --detach FETCH_HEAD
          test "$(git -C "$dst" rev-parse HEAD)" = "$VULKAN_HEADERS_REVISION"

      # The Debug build also turns on the opt-in Tracy profiler and the opt-in
      # Vulkan back end (r_backend vulkan in KisakCOD-mp), so both compile and
      # link for Win32 on every push; Release stays the player build with
      # neither unless a manual run asks for the profiler.
      - name: Configure CMake ${{ matrix.config }}
        run: |
          $tracy = 'OFF'
          if ('${{ matrix.config }}' -eq 'Debug' -or '${{ inputs.tracy }}' -eq 'true') { $tracy = 'ON' }
          $vulkan = @()
          if ('${{ matrix.config }}' -eq 'Debug') {
            $vulkan = @('-DKISAK_BUILD_VULKAN_BACKEND=ON', "-DKISAK_VULKAN_INCLUDE_DIR=$env:RUNNER_TEMP/Vulkan-Headers/include")
          }
          cmake -S . -B build-${{ matrix.config }} -G "Visual Studio 17 2022" -A Win32 -DDXSDK_DIR="${{ env.DXSDK_DIR }}" -DCICD=1 -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DKISAK_WIN_TRACY="$tracy" @vulkan | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.config }}' -eq 'Debug') {
            if (-not (Select-String -Path configure.log -SimpleMatch -Quiet 'Vulkan back end: linked into KisakCOD-mp')) {
              Write-Host "::error::the Vulkan back end was not linked into KisakCOD-mp"
              exit 1
            }
          }

      - name: Build ${{ matrix.config }}
        # One MSBuild call for the three games: --parallel lets the projects
        # build side by side (each already compiles with /MP), so one game links
        # while another compiles, instead of one target after the other.
        run: |
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --parallel `
            --target KisakCOD-sp KisakCOD-mp KisakCOD-dedi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check native Windows bootstrap
        run: |
          ./scripts/ci/check-windows-bootstrap.ps1 -BuildOutput "bin/${{ matrix.config }}" -DxSdkPackage "${{ env.DXSDK_DIR_NUGET }}"

      # The Vulkan loader is opened at run time (src/win32/vulkan), never
      # imported, so the game still starts on a machine without Vulkan; the
      # bootstrap check above starts the Debug game with the back end linked.
      # dumpbin reads the import table itself: the name also appears in the
      # host's messages, so a plain text search would match.
      - name: Check KisakCOD-mp does not import vulkan-1.dll
        if: matrix.config == 'Debug'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { Write-Host "::error::dumpbin.exe not found"; exit 1 }
          $imports = & $dumpbin /nologo /dependents "bin/${{ matrix.config }}/KisakCOD-mp.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports | Write-Host
          if ($imports -match '(?i)^\s*vulkan-1\.dll\s*$') {
            Write-Host "::error::KisakCOD-mp.exe must not import vulkan-1.dll"
            exit 1
          }
          if (-not ($imports -match '(?i)^\s*d3d9\.dll\s*$')) {
            Write-Host "::error::KisakCOD-mp.exe should still import d3d9.dll"
            exit 1
          }

      - name: Check D3DX shader runtime
        run: |
          cmake -S scripts/tests/d3dx -B build-d3dx -G "Visual Studio 17 2022" -A Win32 -DDXSDK_DIR="${{ env.DXSDK_DIR }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-d3dx --config ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeDir = Join-Path $PWD "build-d3dx/${{ matrix.config }}"
          $runtimeDir = Join-Path "${{ env.DXSDK_DIR }}" "release/bin/x86"
          Copy-Item (Join-Path $runtimeDir 'D3DX9_43.dll') $probeDir
          Copy-Item (Join-Path $runtimeDir 'D3DCompiler_43.dll') $probeDir
          & (Join-Path $probeDir 'kisakcod-d3dx-runtime.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KisakCOD-${{ matrix.config }}${{ inputs.tracy && '-Tracy' || '' }}
          path: ${{ github.workspace }}/bin
          compression-level: 9
          # A profiling build is kept as long as the x64 one, for the next PC run.
          retention-days: ${{ inputs.tracy && 3 || 1 }}

  x64-census:
    # The Windows x64 row of the CI matrix upstream issue 1 asks for
    # (docs/linux-x64.md). Configures the normal project with -A x64 and movies
    # on (KISAK_WIN64_CINEMATICS, FFmpeg from vcpkg), builds the SP, MP and
    # dedicated targets, and fails when any of them does not build. The
    # summary sorts the remaining 64-bit warnings into the categories of the
    # Linux x86_64 census. It runs after a merge and on manual runs, not on
    # every pull request push.
    name: MSVC x64 build
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 110

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_PKG: Microsoft.DXSDK.D3DX
      DXSDK_VER: 9.29.952.8
      # Vulkan-Headers v1.3.296, as the vulkan-probe job
      VULKAN_HEADERS_REVISION: 29f979ee5aa58b7b005f805ea8df7a855c39ff37

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK (for nuget usage)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore DXSDK NuGet package
        run: |
          dotnet new classlib -o dxsdk-temp
          cd dxsdk-temp
          dotnet add package $env:DXSDK_PKG --version $env:DXSDK_VER
          cd ..

      - name: Extract DXSDK paths from NuGet
        shell: powershell
        run: |
          $pkgPath = Join-Path "${env:NUGET_PACKAGES}" "$env:DXSDK_PKG\$env:DXSDK_VER"
          $sdkDir = Join-Path $pkgPath "build\native"
          echo "DXSDK_DIR=$sdkDir" >> $env:GITHUB_ENV

      - name: Install latest CMake
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # the "latest" branch on 2026-11-05

      - name: Check the MSVC x64 summarizer
        run: |
          python scripts/ci/test_summarize_msvc_x64.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Movies on x64 (KISAK_WIN64_CINEMATICS) need FFmpeg's libavcodec and
      # libavutil. vcpkg builds them once per runner image; the cache keeps the
      # built package.
      - name: Note the runner image for the FFmpeg cache
        id: image
        run: echo "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore the FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-ffmpeg-avcodec-x64-windows-release-${{ steps.image.outputs.version }}

      - name: Install FFmpeg (libavcodec, libavutil) with vcpkg
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "ffmpeg[core,avcodec]:x64-windows-release" --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "KISAK_FFMPEG_ROOT=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-release" >> $env:GITHUB_ENV

      - name: Fetch the pinned Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/Vulkan-Headers"
          git init "$dst"
          git -C "$dst" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$dst" fetch --depth 1 origin "$VULKAN_HEADERS_REVISION"
          git -C "$dst" checkout --detach FETCH_HEAD
          test "$(git -C "$dst" rev-parse HEAD)" = "$VULKAN_HEADERS_REVISION"

      # A manual run with the tracy input builds the profiling executables.
      # KisakCOD-mp carries the opt-in Vulkan back end, off until a player sets
      # r_backend vulkan, so this artifact can run it on a Windows PC.
      - name: Configure x64
        run: |
          $tracy = 'OFF'
          if ('${{ inputs.tracy }}' -eq 'true') { $tracy = 'ON' }
          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64 -DDXSDK_DIR="${{ env.DXSDK_DIR }}" -DCICD=1 -DCMAKE_BUILD_TYPE=Release `
            -DKISAK_WIN64_CINEMATICS=ON -DKISAK_FFMPEG_ROOT="${{ env.KISAK_FFMPEG_ROOT }}" -DKISAK_WIN_TRACY="$tracy" `
            -DKISAK_BUILD_VULKAN_BACKEND=ON -DKISAK_VULKAN_INCLUDE_DIR="$env:RUNNER_TEMP/Vulkan-Headers/include" | Tee-Object -FilePath configure-x64.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path configure-x64.log -SimpleMatch -Quiet 'Vulkan back end: linked into KisakCOD-mp')) {
            Write-Host "::error::the Vulkan back end was not linked into KisakCOD-mp"
            exit 1
          }

      # Every target is built and logged before the job fails, so one run
      # shows all of them.
      - name: Build x64
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $failed = @()
          foreach ($target in @("KisakCOD-sp", "KisakCOD-mp", "KisakCOD-dedi")) {
            $log = Join-Path $PWD "artifacts\msvc-x64-$target.log"
            cmake --build build-x64 --config Release --target $target -- /m "/flp:LogFile=$log;Verbosity=minimal;Encoding=UTF-8"
            Write-Host "$target exit code: $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $failed += $target }
          }
          echo "X64_FAILED=$($failed -join ' ')" >> $env:GITHUB_ENV
          exit 0

      - name: Summarize x64 build
        run: |
          python scripts/ci/summarize_msvc_x64.py --root "${{ github.workspace }}" --report-dir artifacts/msvc-x64 `
            "KisakCOD-sp=artifacts/msvc-x64-KisakCOD-sp.log" `
            "KisakCOD-mp=artifacts/msvc-x64-KisakCOD-mp.log" `
            "KisakCOD-dedi=artifacts/msvc-x64-KisakCOD-dedi.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content artifacts/msvc-x64/msvc-x64-census.md | Add-Content $env:GITHUB_STEP_SUMMARY
          # The summary shows a few sites per category; list every distinct error here.
          Get-Content artifacts/msvc-x64-*.log | Select-String -Pattern ': (fatal )?error ' |
            ForEach-Object { ($_.Line -replace '\[[^\]]*\.vcxproj\]', '').Trim() } | Sort-Object -Unique

      # The same start-up check as the 32-bit jobs, on the x64 multiplayer
      # executable: it must reach the missing-game-assets error.
      - name: Check native Windows x64 bootstrap
        if: env.X64_FAILED == ''
        run: |
          $nugetDxsdk = Join-Path "${env:NUGET_PACKAGES}" "$env:DXSDK_PKG\$env:DXSDK_VER"
          ./scripts/ci/check-windows-bootstrap.ps1 -BuildOutput "bin/Release" -DxSdkPackage $nugetDxsdk -Arch x64

      - name: Fail when an x64 target did not build
        run: |
          if ($env:X64_FAILED) {
            Write-Host "::error::Did not build for x64: $env:X64_FAILED"
            exit 1
          }
          Write-Host "KisakCOD-sp, KisakCOD-mp and KisakCOD-dedi built for x64"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # MSBuild logs and the report; no binaries.
          name: KisakCOD-msvc-x64-census
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      # The x64 executables with their FFmpeg DLLs, for a run on a Windows
      # machine (the game files are not part of it).
      - uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-x64-Release${{ inputs.tracy && '-Tracy' || '' }}
          path: ${{ github.workspace }}/bin
          compression-level: 9
          retention-days: 3

  arm64:
    # After a merge and on manual runs only, like the x64 build: pull
    # requests build Win32 Debug and Release (docs/ci.md).
    if: github.event_name != 'pull_request'
    # Windows on Arm (docs/linux-arm64.md): MSVC ARM64 build of the SP, MP and
    # dedicated games on GitHub's native Arm runner (free for public
    # repositories), the same missing-game-assets start-up check as the other
    # Windows jobs, and a check that MSVC fused no multiply-adds into engine
    # code (float results must match x86, as on Arm Linux). Movies stay off: no
    # FFmpeg here. No game data.
    name: MSVC ARM64 build
    runs-on: windows-11-arm
    timeout-minutes: 90

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_PKG: Microsoft.DXSDK.D3DX
      DXSDK_VER: 9.29.952.8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only the D3DX9 headers are used: the package has no ARM64 libraries.
      - name: Install .NET SDK (for nuget usage)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore DXSDK NuGet package
        run: |
          dotnet new classlib -o dxsdk-temp
          cd dxsdk-temp
          dotnet add package $env:DXSDK_PKG --version $env:DXSDK_VER
          cd ..

      - name: Extract DXSDK paths from NuGet
        shell: powershell
        run: |
          $pkgPath = Join-Path "${env:NUGET_PACKAGES}" "$env:DXSDK_PKG\$env:DXSDK_VER"
          $sdkDir = Join-Path $pkgPath "build\native"
          echo "DXSDK_DIR=$sdkDir" >> $env:GITHUB_ENV
          echo "DXSDK_DIR_NUGET=$pkgPath" >> $env:GITHUB_ENV

      - name: Report tools
        run: |
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -format value -property displayName
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostarm64\arm64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\dumpbin.exe' | Select-Object -First 1
          }
          if (-not $dumpbin) { Write-Host "::error::dumpbin.exe not found"; exit 1 }
          Write-Host "dumpbin: $dumpbin"
          echo "DUMPBIN=$dumpbin" >> $env:GITHUB_ENV

      # The windows-11-arm image carries Visual Studio 2026 (no 2022).
      - name: Configure ARM64
        run: |
          cmake -S . -B build-arm64 -G "Visual Studio 18 2026" -A ARM64 -DDXSDK_DIR="${{ env.DXSDK_DIR }}" -DCICD=1 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ARM64
        run: |
          cmake --build build-arm64 --config Release --parallel `
            --target KisakCOD-sp KisakCOD-mp KisakCOD-dedi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the executables are ARM64 and free of fused multiply-adds
        run: |
          foreach ($exe in @("KisakCOD-sp", "KisakCOD-mp", "KisakCOD-dedi")) {
            $headers = & $env:DUMPBIN /nologo /headers "bin/Release/$exe.exe" | Out-String
            if ($headers -notmatch 'AA64 machine \(ARM64\)') {
              Write-Host "::error::$exe.exe is not an ARM64 executable"
              exit 1
            }
          }
          # The engine's own object files, not the static C runtime (its math
          # functions may use fused multiply-add on purpose).
          $objects = Get-ChildItem build-arm64 -Recurse -Filter *.obj |
            Where-Object { $_.FullName -match '[\\/]KisakCOD-(sp|mp|dedi)\.dir[\\/]' }
          Write-Host "$($objects.Count) engine object files"
          if ($objects.Count -lt 100) { Write-Host "::error::engine object files not found"; exit 1 }
          $fused = @()
          foreach ($obj in $objects) {
            $hits = & $env:DUMPBIN /nologo /disasm $obj.FullName |
              Select-String -Pattern '\s(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\s'
            if ($hits) { $fused += "$($obj.Name): $($hits[0].Line.Trim())" }
          }
          if ($fused.Count -ne 0) {
            $fused | Select-Object -First 20 | ForEach-Object { Write-Host $_ }
            Write-Host "::error::$($fused.Count) engine object files contain fused multiply-add instructions"
            exit 1
          }
          Write-Host "No fused multiply-add instructions in engine code"

      - name: Check native Windows ARM64 bootstrap
        run: |
          ./scripts/ci/check-windows-bootstrap.ps1 -BuildOutput "bin/Release" -DxSdkPackage "${{ env.DXSDK_DIR_NUGET }}" -Arch arm64

      # The ARM64 executables with their OpenAL DLL, for a run on a Windows on
      # Arm machine (the game files are not part of it).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KisakCOD-arm64-Release
          path: ${{ github.workspace }}/bin
          compression-level: 9
          retention-days: 3

  vulkan-probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # The Vulkan window probe (docs/vulkan-core.md) built with MSVC for x64 on
    # its own (scripts/vulkan_probe/CMakeLists.txt): no game, no DirectX SDK
    # (the D3D9 front's check compiles against the Windows SDK's d3d9.h and
    # links no D3D9 library).
    # SDL3 and the Vulkan headers are built or fetched at pinned revisions (SDL3
    # is the same pin as the Linux jobs). Hosted runners have no GPU, so the
    # check here only starts the executable (proving SDL3.dll loads); the
    # artifact is for a run on a Windows PC with a Vulkan driver.
    name: Vulkan window probe (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      # Vulkan-Headers v1.3.296
      VULKAN_HEADERS_REVISION: 29f979ee5aa58b7b005f805ea8df7a855c39ff37

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore the pinned SDL3 SDK
        id: sdl3-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\SDL3-sdk
          key: sdl3-sdk-msvc-x64-${{ env.SDL3_REVISION }}

      - name: Build the pinned SDL3 SDK
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/SDL3-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/libsdl-org/SDL.git
          git -C "$src" fetch --depth 1 origin "$SDL3_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$SDL3_REVISION"
          cmake -S "$src" -B "$RUNNER_TEMP/SDL3-build" -A x64 \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL3-build" --config Release --parallel
          cmake --install "$RUNNER_TEMP/SDL3-build" --config Release

      - name: Fetch the pinned Vulkan headers
        shell: bash
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/Vulkan-Headers"
          git init "$dst"
          git -C "$dst" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$dst" fetch --depth 1 origin "$VULKAN_HEADERS_REVISION"
          git -C "$dst" checkout --detach FETCH_HEAD
          test "$(git -C "$dst" rev-parse HEAD)" = "$VULKAN_HEADERS_REVISION"

      - name: Build the Vulkan window probe
        shell: bash
        run: |
          set -euo pipefail
          cmake -S scripts/vulkan_probe -B build-vulkan -A x64 \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL3-sdk" \
            -DKISAK_VULKAN_INCLUDE_DIR="$RUNNER_TEMP/Vulkan-Headers/include" \
            -DKISAK_BUILD_VULKAN_SHADERS=ON -DKISAK_BUILD_VULKAN_LEGACY=ON
          cmake --build build-vulkan --config Release \
            --target KisakCOD-vulkan-probe KisakCOD-vulkan-shaders KisakCOD-vulkan-legacy-check \
            KisakCOD-vulkan-d3d9-check --parallel
          mkdir -p artifacts/vulkan-probe
          cp build-vulkan/Release/KisakCOD-vulkan-probe.exe build-vulkan/Release/SDL3.dll \
            build-vulkan/Release/KisakCOD-vulkan-shaders.exe \
            build-vulkan/Release/KisakCOD-vulkan-legacy-check.exe \
            build-vulkan/Release/KisakCOD-vulkan-d3d9-check.exe artifacts/vulkan-probe/

      - name: Check the Legacy shader translator
        shell: bash
        run: |
          set -euo pipefail
          # The MSVC build of dxbc-spirv and our lowering, on the shader spike's
          # test shaders: translation, refusals, uniform block layouts,
          # reflection and linking. The runner has no spirv-val; the Linux
          # vulkan_window job validates the same shaders' SPIR-V.
          python -u scripts/tests/test_vulkan_legacy_shaders.py \
            --binary artifacts/vulkan-probe/KisakCOD-vulkan-shaders.exe --no-spirv-val

      - name: Check the Vulkan tools start
        shell: bash
        run: |
          set -euo pipefail
          # The Vulkan loader is opened at run time through SDL, never linked.
          # Usage errors exit 2 after printing usage, which needs SDL3.dll to
          # have loaded; a missing DLL fails before main. The runner has no
          # Vulkan driver, so the Legacy and D3D9 checks' scenes run on the PC.
          for tool in KisakCOD-vulkan-probe KisakCOD-vulkan-legacy-check KisakCOD-vulkan-d3d9-check; do
            if grep -aqi 'vulkan-1\.dll' "artifacts/vulkan-probe/$tool.exe"; then
              echo "$tool.exe must not import vulkan-1.dll" >&2
              exit 1
            fi
            # The D3D9 front is the D3D9 implementation: no d3d9.dll import.
            if grep -aqi 'd3d9\.dll' "artifacts/vulkan-probe/$tool.exe"; then
              echo "$tool.exe must not import d3d9.dll" >&2
              exit 1
            fi
            set +e
            "artifacts/vulkan-probe/$tool.exe" --help > "artifacts/$tool-help.log" 2>&1
            status=$?
            set -e
            cat "artifacts/$tool-help.log"
            test "$status" -eq 2
            grep -q '^usage:' "artifacts/$tool-help.log"
          done

      # The probe with SDL3.dll, for a run on a Windows PC with a Vulkan driver.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KisakCOD-vulkan-probe-x64
          path: artifacts/vulkan-probe
          retention-days: 3
