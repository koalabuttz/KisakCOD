name: Script canonical field IDs

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - src/script/scr_compiler2.cpp
      - src/script/scr_main.cpp
      - src/script/scr_archive.cpp
      - src/script/scr_vm.cpp
      - scripts/tests/test_script_canonical_field_ids.py
      - .github/workflows/script-canonical-fields.yaml
  push:
    branches: [master]
    paths:
      - src/script/scr_compiler2.cpp
      - src/script/scr_main.cpp
      - src/script/scr_archive.cpp
      - src/script/scr_vm.cpp
      - scripts/tests/test_script_canonical_field_ids.py
      - .github/workflows/script-canonical-fields.yaml

jobs:
  fields:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/test_script_canonical_field_ids.py
