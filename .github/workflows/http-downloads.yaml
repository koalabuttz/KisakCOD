name: HTTP download lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - CMakeLists.txt
      - scripts/extern/curl.cmake
      - scripts/pre_build.cmake
      - src/qcommon/dl_main.*
      - src/client_mp/cl_main_mp.cpp
      - src/client_mp/cl_parse_mp.cpp
      - scripts/tests/test_http_download*.py
      - scripts/tests/http/**
      - .github/workflows/http-downloads.yaml
  push:
    branches: [master]
    paths:
      - CMakeLists.txt
      - scripts/extern/curl.cmake
      - scripts/pre_build.cmake
      - src/qcommon/dl_main.*
      - src/client_mp/cl_main_mp.cpp
      - src/client_mp/cl_parse_mp.cpp
      - scripts/tests/test_http_download*.py
      - scripts/tests/http/**
      - .github/workflows/http-downloads.yaml

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: Ninja
            architecture: ''
            executable: build-http-probe/kisakcod-http-runtime-check
          - os: windows-2022
            generator: Visual Studio 17 2022
            architecture: -A Win32
            executable: build-http-probe/Release/kisakcod-http-runtime-check.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate the certificate generator on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslDir = Join-Path $env:ProgramFiles 'Git/usr/bin'
          if (!(Test-Path (Join-Path $opensslDir 'openssl.exe'))) { throw 'OpenSSL certificate generator unavailable' }
          $opensslDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the production downloader with pinned curl
        shell: bash
        run: |
          cmake -S scripts/tests/http -B build-http-probe -G "${{ matrix.generator }}" ${{ matrix.architecture }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build-http-probe --config Release --parallel 4
      - name: Exercise HTTP, TLS, redirects, cancellation and proxy handling
        shell: bash
        run: python scripts/tests/test_http_downloads.py --executable "${{ matrix.executable }}"
      - name: Check game-client completion and fallback
        if: runner.os == 'Linux'
        run: python scripts/tests/test_http_download_callers.py
