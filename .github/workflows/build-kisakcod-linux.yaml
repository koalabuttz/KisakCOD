name: Linux native server and client foundations

# Builds and checks the 32-bit native Linux dedicated server (KISAK_PLATFORM=linux,
# target KisakCOD-dedi), client core, and optional disconnected SDL window host.
# This is not a playable graphical client. Checks need no installed game data,
# Steam client or credentials. Window checks explicitly use SDL dummy video/audio.
# Only isolated test fixtures accept local traffic; no public server is exposed.
# Tool installation and the pinned Tracy dependency require network access.
#
# Configure and build stay in the workflow and never reuse the Windows output
# paths: each configuration gets its own build directory and its own runtime
# output directory. The Python runner only tests what was built.
#
# Speed: the jobs that build the engine with CMake keep a ccache per job and
# configuration (restored from this branch or master, saved after every run
# that was not cancelled) and build on every runner core. The pinned SDL3 SDK is
# cached under a key that changes with this file, so an edit here rebuilds it.
# A cache only skips compiles whose inputs are unchanged; every check still runs
# against what this run built.

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - build-linux.sh
      - scripts/**
      - src/**
      - deps/**
      - tests/linux_net/**
      - tests/linux_client_core/**
      - tests/linux_client_commands/**
      - tests/linux_window/**
      - tests/linux_renderer/**
      - tests/linux_asset_export/**
      - tests/linux_d3d9_boundary/**
      - tests/linux_compat/**
      - tests/linux_world_frontend/**
      - tests/linux_device_probe/**
      - tests/linux_free_camera/**
      - tests/linux_mp_client/**
      - tests/linux_cinematic/**
      - tests/linux_steam/**
      - tests/skinning/**
      - .github/workflows/build-kisakcod-linux.yaml
      - .github/workflows/build-kisarcod-win.yaml
  pull_request:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - build-linux.sh
      - scripts/**
      - src/**
      - deps/**
      - tests/linux_net/**
      - tests/linux_client_core/**
      - tests/linux_client_commands/**
      - tests/linux_window/**
      - tests/linux_renderer/**
      - tests/linux_asset_export/**
      - tests/linux_d3d9_boundary/**
      - tests/linux_compat/**
      - tests/linux_world_frontend/**
      - tests/linux_device_probe/**
      - tests/linux_free_camera/**
      - tests/linux_mp_client/**
      - tests/linux_cinematic/**
      - tests/linux_steam/**
      - tests/skinning/**
      - .github/workflows/build-kisakcod-linux.yaml
      - .github/workflows/build-kisarcod-win.yaml

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run, so a
# quick fix does not wait behind a run that no longer matters. A newer push to
# master does the same to an older master run: it checks everything merged so
# far, so the older run only held runners. Manual runs get a group of their own
# and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  window:
    name: Linux SDL${{ matrix.sdl }} window ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]
        # Pull requests build and test the SDL3 window host in both configurations.
        # The older SDL2 path, the slowest pair of jobs, runs on pushes to master
        # and on manual runs, so it is still checked after every merge.
        sdl: ${{ fromJSON(github.event_name == 'pull_request' && '[3]' || '[2, 3]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1
      - name: Install 32-bit window build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          scripts/ci/apt-install.sh \
            cmake ninja-build clang g++-multilib python3 python3-yaml libsdl2-dev:i386 ccache
          test -f /usr/lib/i386-linux-gnu/cmake/SDL2/sdl2-config.cmake
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-window-sdl${{ matrix.sdl }}-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-window-sdl${{ matrix.sdl }}-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh
      - name: Restore pinned 32-bit SDL3 SDK
        if: matrix.sdl == 3
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-i386-877399b2b2cf21e67554ed9046410f268ce1d1b2-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}
      - name: Build pinned 32-bit SDL3 SDK
        if: matrix.sdl == 3
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # A restored SDK (same pin, same options: the cache key changes with
          # this file) skips the build; the checks below run either way.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            # SDL release-3.2.10, pinned to its full source revision.
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin 877399b2b2cf21e67554ed9046410f268ce1d1b2
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = 877399b2b2cf21e67554ed9046410f268ce1d1b2
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF \
              2>&1 | tee artifacts/sdl3-configure.log
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | tee artifacts/sdl3-elf.log
          grep -q ELF32 artifacts/sdl3-elf.log
      - name: Check graphical workflow contract
        run: python3 scripts/tests/test_linux_window_workflow.py
      - name: Build and test asset-free window host
        timeout-minutes: 45
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sdk_args=(--sdl2-dir /usr/lib/i386-linux-gnu/cmake/SDL2)
          if [[ "${{ matrix.sdl }}" == 3 ]]; then
            sdk_args=(--sdl3-dir "$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3")
            export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          python3 -u scripts/tests/test_linux_window.py \
            --build-dir "$GITHUB_WORKSPACE/build-linux/window-sdl${{ matrix.sdl }}-${{ matrix.config }}" \
            --build-type "${{ matrix.config }}" --cc clang --cxx clang++ --jobs "$(nproc)" \
            --sdl-major "${{ matrix.sdl }}" "${sdk_args[@]}" --video-driver dummy \
            2>&1 | tee "artifacts/window-sdl${{ matrix.sdl }}-${{ matrix.config }}.log"
      - name: Upload window check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-window-sdl${{ matrix.sdl }}-${{ matrix.config }}
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-window-sdl${{ matrix.sdl }}-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  native:
    name: Native Linux ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      # Separate from bin/<config> so the Windows targets keep their own outputs.
      BUILD_DIR: build-linux/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/linux-${{ matrix.config }}
      BINARY: out/linux-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install native 32-bit build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake ninja-build clang g++-multilib python3 ccache glslang-tools

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-native-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Report compiler versions
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          clang++ --version
          cmake --version
          ninja --version
          python3 --version
          echo "target architecture probe:"
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          clang++ -m32 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"
          echo "32-bit link works"

      - name: Configure ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Build KisakCOD-dedi
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel "$(nproc)"
          test -x "$BINARY"
          ls -l "$BINARY"

      - name: Check test-runner configuration and failure handling
        shell: bash
        run: |
          python3 scripts/tests/test_linux_check_runner.py
          python3 scripts/tests/test_ci_apt_install.py
          python3 scripts/tests/test_linux_fastfile_driver.py
          python3 scripts/tests/test_linux_client_core_driver.py
          python3 scripts/tests/test_strip_cdecl.py
          python3 scripts/tools/strip_cdecl.py --check
          python3 scripts/tests/test_summarize_alignment_report.py
          python3 scripts/tests/test_float_int_rounding.py
          python3 scripts/tests/test_retail_float_int_scan.py
          python3 scripts/tests/test_openal_sound_formats.py
          python3 scripts/tests/test_openal_stream_seek.py
          python3 scripts/tests/test_linux_sp_level_sweep.py
          python3 scripts/tests/test_shader_spike.py
          python3 scripts/tests/test_vita_gxm_heap.py
          python3 scripts/tests/test_vita_cg_translate.py --require-glslang

      - name: Run asset-free native checks
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/run_linux_checks.py \
            --build-dir "$BUILD_DIR" \
            --binary "$BINARY" \
            --cxx clang++ \
            --log-dir "artifacts/checks-${{ matrix.config }}"

      - name: Build and check native client core
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_linux_client_core.py \
            --cxx clang++ \
            --build-type "${{ matrix.config }}" \
            --jobs "$(nproc)" \
            --build-dir "$GITHUB_WORKSPACE/build-linux/client-core-${{ matrix.config }}"

      - name: Upload executable and check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-linux-${{ matrix.config }}
          # The executable plus text logs only: no bin/ tree, no game data.
          path: |
            ${{ env.BINARY }}
            artifacts/checks-${{ matrix.config }}
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  client_census:
    # Asset-free compile proof for the multiplayer client sources: one syntax-only
    # -m32 front-end pass per production .cpp with the client definitions, checked
    # against scripts/tests/client_compile_census_blocked.txt in both directions.
    # No link, no engine build, no DXVK, no SDL, no GPU, no game data. OpenAL
    # headers are needed because the sound sources include <AL/al.h>. One job:
    # a front-end pass has no optimization level, so Debug and RelWithDebInfo
    # would compile identically. A second pass covers the singleplayer game
    # (KisakCOD-sp, --target sp) against sp_compile_census_blocked.txt.
    name: Asset-free client compile census
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install client census tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake clang g++-multilib python3 python3-yaml libopenal-dev
          clang++ --version
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          clang++ -m32 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"

      - name: Check client census runner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_client_compile_census.py

      - name: Check OpenAL channel stop and stream restart
        # Runs the sound driver's channel-stop and stream-refill code against the
        # system OpenAL Soft (libopenal-dev above) through its offline loopback
        # device. No sound card, no game data.
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_openal_channel_stop.py

      - name: Run client compile census
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_client_compile_census.py \
            --cxx clang++ --jobs 4 \
            --log-dir artifacts/client-census \
            2>&1 | tee artifacts/client-census.log

      - name: Run singleplayer compile census
        # The same pass over the Windows KisakCOD-sp sources with KISAK_SP
        # (scripts/tests/sp_compile_census_blocked.txt). No SP target links yet.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_client_compile_census.py --target sp \
            --cxx clang++ --jobs 4 \
            --log-dir artifacts/sp-census \
            2>&1 | tee artifacts/sp-census.log

      - name: Upload client census logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Compiler diagnostics for failing sources only; no binaries.
          name: KisakCOD-client-census
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  x64_census:
    # Opt-in 64-bit track, step one (docs/linux-x64.md): one syntax-only x86_64
    # Clang pass over every KisakCOD-dedi unit (exact commands from a
    # -DKISAK_LINUX_ARCH=x86_64 configure) and every client census source, with
    # findings filed under the upstream "64-bit Support" milestone issues. Fails
    # only when a source listed in scripts/tests/x64_compile_census_baseline.txt
    # stops compiling for x86_64. No link, no i386 build, no DXVK, no SDL, no GPU,
    # no game data. The i386 build and its layout checks are untouched.
    name: x86_64 compile census
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install x64 census tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake ninja-build clang python3 python3-yaml libopenal-dev
          clang++ --version

      - name: Check x64 census runner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_x64_compile_census.py

      - name: Run x86_64 compile census
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_x64_compile_census.py \
            --cxx clang++ --cc clang --jobs 4 \
            --build-dir "$RUNNER_TEMP/build-x64" \
            --report-dir artifacts/x64-census \
            2>&1 | tee artifacts/x64-census.log

      - name: Publish x64 census summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f artifacts/x64-census/x64-census.md ]]; then
            cat artifacts/x64-census/x64-census.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload x64 census report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Report and compiler diagnostics for failing units only; no binaries.
          name: KisakCOD-x64-census
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  x64_dedicated:
    # Opt-in 64-bit track, step two (docs/linux-x64.md): check the generated
    # fastfile record layout tables against the struct definitions, run the
    # asset-free 64-bit record conversion test, build KisakCOD-dedi with
    # -DKISAK_LINUX_ARCH=x86_64 and run the asset-free bootstrap test against the
    # ELF64 binary. No game data, so loading a real map is not covered here. The
    # i386 build and its checks are untouched.
    name: x86_64 dedicated server ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      BUILD_DIR: build-x64/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/x64-${{ matrix.config }}
      BINARY: out/x64-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install x86_64 build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake ninja-build clang python3 python3-clang-18 ccache

      # The layout check parses db_load.cpp as i386 and as x86_64, so it needs
      # the i386 C and C++ headers. Nothing in this job builds i386 code.
      - name: Install i386 headers for the layout check
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh --no-update g++-multilib

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-x64-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-x64-dedicated-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Configure x86_64 ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=x86_64 \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Check fastfile record layout tables
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # libclang's Python bindings come with the system Python.
          /usr/bin/python3 scripts/tools/gen_db_disk_layout.py --build-dir "$BUILD_DIR" --check

      - name: Check 64-bit fastfile record conversion
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_db_record_conversion.py --cxx clang++

      - name: Build x86_64 KisakCOD-dedi
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel "$(nproc)"
          ls -l "$BINARY"

      # &ptr[-n] with a uint32_t n wraps back on i386 but jumps ~2^32 elements
      # forward on x86_64. The scan is the same for both configurations. It runs
      # after the build because common.cpp includes the generated buildnumber.h.
      - name: Check for negated 32-bit unsigned indexes
        if: matrix.config == 'Debug'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/tools/check_unsigned_negation.py --build-dir "$BUILD_DIR"

      # The bootstrap test, then the platform self-tests (runtime wrappers,
      # network deadlines, UDP, file I/O, virtual memory) built at 64 bits.
      - name: Asset-free x86_64 checks
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/run_linux_checks.py --arch x86_64 \
            --build-dir "$BUILD_DIR" --binary "$BINARY" --cxx clang++

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-x64-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  arm64_dedicated:
    # Opt-in 64-bit Arm track, step one (docs/linux-arm64.md): on GitHub's
    # native Arm runner, build KisakCOD-dedi with -DKISAK_LINUX_ARCH=aarch64, run
    # the asset-free fastfile record conversion test for aarch64 and the
    # asset-free bootstrap test against the ELF64 aarch64 binary. No game data,
    # so loading a real map is not covered here. The x86 builds are untouched.
    name: aarch64 dedicated server ${{ matrix.config }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      BUILD_DIR: build-arm64/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/arm64-${{ matrix.config }}
      BINARY: out/arm64-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install aarch64 build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          scripts/ci/apt-install.sh \
            cmake ninja-build clang python3 ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-arm64-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-arm64-dedicated-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Configure aarch64 ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=aarch64 \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Check 64-bit fastfile record conversion on aarch64
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_db_record_conversion.py --cxx clang++ --arch aarch64

      - name: Build aarch64 KisakCOD-dedi
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel "$(nproc)"
          ls -l "$BINARY"
          # Arm must not fuse multiply-adds (-ffp-contract=off): float results
          # have to match x86 (docs/linux-arm64.md). Optimized builds are where
          # Clang would fuse them.
          if objdump -d "$BINARY" | grep -Eq $'\t(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\\b'; then
            echo "the server contains fused multiply-add instructions" >&2
            exit 1
          fi

      # The bootstrap test, then the platform self-tests (runtime wrappers,
      # network deadlines, UDP, file I/O, virtual memory) built at 64 bits.
      - name: Asset-free aarch64 checks
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/run_linux_checks.py --arch aarch64 \
            --build-dir "$BUILD_DIR" --binary "$BINARY" --cxx clang++

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-arm64-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  armv7_dedicated:
    # Opt-in 32-bit Arm track, the first step toward a PS Vita port
    # (docs/linux-armv7.md): cross-compile KisakCOD-dedi with
    # -DKISAK_LINUX_ARCH=armv7 on the x86 runner, check that engine code keeps
    # x86's float results (no fused multiply-add, no NEON float math), and run
    # the asset-free bootstrap test under qemu-arm. No game data, so loading a
    # real map is not covered here. The other builds are untouched.
    name: armv7 dedicated server ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      BUILD_DIR: build-armv7/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/armv7-${{ matrix.config }}
      BINARY: out/armv7-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install armv7 cross tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake ninja-build clang python3 ccache g++-arm-linux-gnueabihf qemu-user

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-armv7-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-armv7-dedicated-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Configure armv7 ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=armv7 \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Build armv7 KisakCOD-dedi
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel "$(nproc)"
          ls -l "$BINARY"
          # Float results have to match x86 (docs/linux-armv7.md): no fused
          # multiply-adds (-ffp-contract=off), and no NEON float math, which
          # flushes denormals to zero on ARMv7 (-mfpu=vfpv3).
          arm-linux-gnueabihf-objdump -d "$BINARY" > "$RUNNER_TEMP/armv7-dedi.dis"
          if grep -Eq $'\t(vfma|vfms|vfnma|vfnms)' "$RUNNER_TEMP/armv7-dedi.dis"; then
            echo "the server contains fused multiply-add instructions" >&2
            exit 1
          fi
          if grep -Eq $'\tv[a-z0-9]+\.f(32|64)\tq' "$RUNNER_TEMP/armv7-dedi.dis"; then
            echo "the server contains NEON float instructions" >&2
            exit 1
          fi

      - name: Bootstrap armv7 KisakCOD-dedi
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_linux_bootstrap.py --arch armv7 \
            --emulator "qemu-arm -L /usr/arm-linux-gnueabihf" "$BINARY"

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-armv7-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  vita_dedicated:
    # Opt-in PS Vita track (docs/vita.md): build KisakCOD-dedi with Clang
    # against the pinned VitaSDK (scripts/ci/install-vitasdk.sh), pack the
    # .vpk, and check that the server keeps x86's float results (no fused
    # multiply-add, no NEON float math). Nothing runs: there is no Vita here,
    # so start-up and map loading are checked on David's console.
    name: PS Vita dedicated server ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      BUILD_DIR: build-vita/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/vita-${{ matrix.config }}
      BINARY: out/vita-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh cmake ninja-build clang python3 ccache

      - name: Restore VitaSDK
        id: vitasdk_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vitasdk
          key: vitasdk-${{ hashFiles('scripts/ci/install-vitasdk.sh') }}

      - name: Install VitaSDK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "VITASDK=$(scripts/ci/install-vitasdk.sh "$RUNNER_TEMP/vitasdk")" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vita-dedicated-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Configure PS Vita ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=vita \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Build PS Vita KisakCOD-dedi and its .vpk
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi-vpk --parallel "$(nproc)"
          ls -l "$BINARY" "$BINARY.vpk"
          # Float results have to match x86 (docs/vita.md): no fused
          # multiply-adds, and no NEON float math on Q or D registers (NEON
          # flushes denormals to zero); scalar VFP uses S registers for floats.
          "$VITASDK/bin/arm-vita-eabi-objdump" -d "$BINARY" > "$RUNNER_TEMP/vita-dedi.dis"
          if grep -Eq $'\t(vfma|vfms|vfnma|vfnms)' "$RUNNER_TEMP/vita-dedi.dis"; then
            echo "the server contains fused multiply-add instructions" >&2
            exit 1
          fi
          if grep -Eq $'\tv[a-z0-9]+\.f(32|64)\tq|\tv[a-z0-9]+\.f32\td' "$RUNNER_TEMP/vita-dedi.dis"; then
            echo "the server contains NEON float instructions" >&2
            exit 1
          fi
          # Symbols the link must keep (scripts/platform/vita/CMakeLists.txt):
          # libgcc's weak pthread references (an unresolved one switches its
          # thread support off, and every thread_local becomes shared), and
          # sceUserMainThreadStackSize, which sets the main thread's stack.
          "$VITASDK/bin/arm-vita-eabi-nm" "$BINARY" > "$RUNNER_TEMP/vita-dedi.sym"
          if grep -Eq '^ +w pthread_' "$RUNNER_TEMP/vita-dedi.sym"; then
            grep -E '^ +w pthread_' "$RUNNER_TEMP/vita-dedi.sym" >&2
            echo "the server leaves weak pthread references unresolved" >&2
            exit 1
          fi
          for symbol in pthread_cancel pthread_once sceUserMainThreadStackSize; do
            if ! grep -Eq " [TD] $symbol\$" "$RUNNER_TEMP/vita-dedi.sym"; then
              echo "the server does not link $symbol" >&2
              exit 1
            fi
          done

      - name: Upload the .vpk
        if: ${{ matrix.config == 'RelWithDebInfo' }}
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-dedi-vita-${{ matrix.config }}
          path: ${{ env.BINARY }}.vpk
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-dedicated-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  vita_mp_client:
    # Opt-in PS Vita client, stage 1 (docs/vita-client.md): build KisakCOD-mp
    # with Clang against the pinned VitaSDK and pack its .vpk. The D3D9
    # declarations come from DXVK Native's headers (nothing of DXVK is built)
    # and the OpenAL ones from libopenal-dev; the client links no D3D9 or OpenAL
    # library. The same float and link checks as the Vita server. The client
    # does not run here: start-up is checked on David's Vita. Its control
    # mapping and its small OpenAL do, as host tests.
    name: PS Vita multiplayer client ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      BUILD_DIR: build-vita-mp/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/vita-mp-${{ matrix.config }}
      BINARY: out/vita-mp-${{ matrix.config }}/KisakCOD-mp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libopenal-dev only for its headers, copied below on their own.
          scripts/ci/apt-install.sh cmake ninja-build clang python3 ccache libopenal-dev
          mkdir -p "$RUNNER_TEMP/al-include"
          cp -r /usr/include/AL "$RUNNER_TEMP/al-include/"

      - name: Restore VitaSDK
        id: vitasdk_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vitasdk
          key: vitasdk-${{ hashFiles('scripts/ci/install-vitasdk.sh') }}

      - name: Install VitaSDK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "VITASDK=$(scripts/ci/install-vitasdk.sh "$RUNNER_TEMP/vitasdk")" >> "$GITHUB_ENV"

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as the Linux client jobs. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-mp-client-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vita-mp-client-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Check the client's controls and sound on the host
        # The control mapping and the small OpenAL make no Vita call: the host
        # compiler builds them with sanitizers and runs their checks.
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_vita_input.py
          python3 scripts/tests/test_vita_sound.py --al-include "$RUNNER_TEMP/al-include"

      - name: Configure PS Vita client ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=vita \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY" \
            -DKISAK_BUILD_VITA_MP_CLIENT=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_OPENAL_INCLUDE_DIR="$RUNNER_TEMP/al-include"

      - name: Build PS Vita KisakCOD-mp and its .vpk
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-mp-vpk KisakCOD-gxm-probe-vpk --parallel "$(nproc)"
          ls -l "$BINARY" "$BINARY.vpk" "$(dirname "$BINARY")/KisakCOD-gxm-probe.vpk"
          "$VITASDK/bin/arm-vita-eabi-size" -A "$BINARY" | grep -E '^\.(text|rodata|data|bss) '
          # Float results have to match x86 (docs/vita.md): client prediction
          # replays the server's movement math.
          "$VITASDK/bin/arm-vita-eabi-objdump" -d "$BINARY" > "$RUNNER_TEMP/vita-mp.dis"
          if grep -Eq $'\t(vfma|vfms|vfnma|vfnms)' "$RUNNER_TEMP/vita-mp.dis"; then
            echo "the client contains fused multiply-add instructions" >&2
            exit 1
          fi
          if grep -Eq $'\tv[a-z0-9]+\.f(32|64)\tq|\tv[a-z0-9]+\.f32\td' "$RUNNER_TEMP/vita-mp.dis"; then
            echo "the client contains NEON float instructions" >&2
            exit 1
          fi
          "$VITASDK/bin/arm-vita-eabi-nm" "$BINARY" > "$RUNNER_TEMP/vita-mp.sym"
          if grep -Eq '^ +w pthread_' "$RUNNER_TEMP/vita-mp.sym"; then
            grep -E '^ +w pthread_' "$RUNNER_TEMP/vita-mp.sym" >&2
            echo "the client leaves weak pthread references unresolved" >&2
            exit 1
          fi
          for symbol in pthread_cancel pthread_once sceUserMainThreadStackSize; do
            if ! grep -Eq " [TD] $symbol\$" "$RUNNER_TEMP/vita-mp.sym"; then
              echo "the client does not link $symbol" >&2
              exit 1
            fi
          done

      - name: Upload the .vpk
        if: ${{ matrix.config == 'RelWithDebInfo' }}
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-mp-vita-${{ matrix.config }}
          path: |
            ${{ env.BINARY }}.vpk
            ${{ env.CMAKE_RUNTIME_OUTPUT_DIRECTORY }}/KisakCOD-gxm-probe.vpk
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-mp-client-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  x64_client:
    # Opt-in 64-bit track, step three (docs/linux-x64.md): build the multiplayer
    # client KisakCOD-mp with -DKISAK_LINUX_ARCH=x86_64 against x86_64 SDL3 and
    # the D3D9 and OpenAL stand-ins (built -m64), then run the same asset-free
    # checks as the i386 client: the game window test and the client's start
    # from temporary trees with no game data. It is not playable yet; nothing
    # here draws a frame. The i386 client job is untouched.
    name: x86_64 multiplayer client
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      BUILD_DIR: build-x64/mp-client
      OUT_DIR: ${{ github.workspace }}/out/x64-mp-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install x86_64 build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libopenal-dev only for <AL/al.h>; the client links the OpenAL stand-in.
          # libavcodec-dev and libavutil-dev for the Bink shim the client is
          # built with here (KISAK_LINUX_CINEMATICS, docs/linux-cinematics.md).
          scripts/ci/apt-install.sh \
            cmake ninja-build clang binutils python3 python3-clang-18 ccache libopenal-dev \
            libavcodec-dev libavutil-dev

      # The size literal check parses every source as i386 and as x86_64, so it
      # needs the i386 C and C++ headers. Nothing in this job builds i386 code.
      - name: Install i386 headers for the size literal check
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh --no-update g++-multilib

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-x64-mp-client-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-x64-mp-client-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Restore pinned x86_64 SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-x86_64-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}

      - name: Build pinned x86_64 SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same pin and options as the i386 client job, built -m64.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS=-m64 -DCMAKE_SHARED_LINKER_FLAGS=-m64 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | grep -Eq 'Class:[[:space:]]+ELF64'

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as the i386 client job. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the x86_64 multiplayer client against the stand-ins
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stand-ins"
          d3d9="$RUNNER_TEMP/stand-ins/libd3d9_unavailable.so"
          openal="$RUNNER_TEMP/stand-ins/libopenal_unavailable.so"
          clang++ -m64 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libd3d9_unavailable.so \
            tests/linux_device_probe/d3d9_unavailable.cpp -o "$d3d9"
          clang++ -m64 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libopenal_unavailable.so \
            tests/linux_mp_client/openal_unavailable.cpp -o "$openal"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=x86_64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_DXVK_NATIVE_LIBRARY="$d3d9" \
            -DKISAK_BUILD_LINUX_MP_CLIENT=ON -DKISAK_OPENAL_LIBRARY="$openal" \
            -DKISAK_LINUX_CINEMATICS=ON \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "$BUILD_DIR" --target KisakCOD-mp KisakCOD-mp-client-window-test \
            KisakCOD-native-d3d9-proofs KisakCOD-bink-shim-test KisakCOD-skin-sse2-test \
            KisakCOD-skin-scalar-test \
            --parallel "$(nproc)"
          for binary in "$OUT_DIR/KisakCOD-mp" "$OUT_DIR/KisakCOD-mp-client-window-test"; do
            readelf -h "$binary" | grep -Eq 'Class:[[:space:]]+ELF64'
            readelf -h "$binary" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          done
          readelf -d "$OUT_DIR/KisakCOD-mp" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/x64-mp-client-needed.txt"
          cat "$RUNNER_TEMP/x64-mp-client-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/x64-mp-client-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/x64-mp-client-needed.txt"
          grep -qx 'libopenal_unavailable.so' "$RUNNER_TEMP/x64-mp-client-needed.txt"
          # Built with the Bink shim, which decodes movies with libavcodec.
          grep -Eqx 'libavcodec\.so\.[0-9]+' "$RUNNER_TEMP/x64-mp-client-needed.txt"
          grep -Eqx 'libavutil\.so\.[0-9]+' "$RUNNER_TEMP/x64-mp-client-needed.txt"
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libopenal_unavailable\.so|libavcodec\.so\.[0-9]+|libavutil\.so\.[0-9]+|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/x64-mp-client-needed.txt"; then
            echo "the multiplayer client needs a library beyond SDL3, D3D9, OpenAL, libavcodec and the runtimes" >&2
            exit 1
          fi
          # libavcodec refers to zlib names the game also defines; the client
          # must not export them, or any other name, to the libraries it loads
          # (scripts/platform/linux/mp_client_exports.map).
          if nm -D --defined-only "$OUT_DIR/KisakCOD-mp" | awk '{print $3}' | grep -vx '_IO_stdin_used'; then
            echo "the multiplayer client exports names to shared libraries" >&2
            exit 1
          fi

      # A struct's i386 size written as a number allocates or clears too few
      # bytes on x86_64 when the struct holds a pointer (docs/linux-x64.md,
      # "Struct sizes written as numbers"). It runs after the build because
      # common.cpp includes the generated buildnumber.h.
      - name: Check for 32-bit struct sizes written as numbers
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/tests/test_check_32bit_size_literals.py
          /usr/bin/python3 scripts/tools/check_32bit_size_literals.py --build-dir "$BUILD_DIR"

      # A field reached through its i386 byte offset, a pointer read at a fixed
      # byte offset, or a union copied through a 4-byte member lands on the
      # wrong bytes on x86_64 (docs/linux-x64.md, "Byte offsets and union
      # copies").
      - name: Check for 32-bit byte offsets and union copies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/tests/test_check_32bit_layout_offsets.py
          /usr/bin/python3 scripts/tools/check_32bit_layout_offsets.py --build-dir "$BUILD_DIR"

      - name: Run the x86_64 multiplayer client's fail-closed start
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/stand-ins"
          "$OUT_DIR/KisakCOD-mp-client-window-test"
          python3 -u scripts/tests/test_linux_mp_client.py --binary "$OUT_DIR/KisakCOD-mp"

      # The Bink shim on made-up movies and a stand-in decoder, plus
      # libavcodec's Bink decoders opened as the shim opens them. No game
      # movie is read (docs/linux-cinematics.md).
      - name: Run the Bink shim's asset-free test
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$RUNNER_TEMP/stand-ins" "$OUT_DIR/KisakCOD-bink-shim-test"

      # The SSE2 form of the vertex skinning code (x64 Windows has no MMX
      # intrinsics) against the MMX form, on random surfaces and bones.
      - name: Run the skinning SSE2 check
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$OUT_DIR/KisakCOD-skin-sse2-test"

      # The scalar skinning code Arm builds use, against the SSE path and the
      # output bytes every architecture must produce.
      - name: Run the scalar skinning check
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$OUT_DIR/KisakCOD-skin-scalar-test"

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-x64-mp-client-${{ github.run_id }}-${{ github.run_attempt }}

  arm64_client:
    # Opt-in 64-bit Arm track, step three (docs/linux-arm64.md): on GitHub's
    # native Arm runner, build the multiplayer client KisakCOD-mp with
    # -DKISAK_LINUX_ARCH=aarch64 against aarch64 SDL3 and the D3D9 and OpenAL
    # stand-ins, then run the asset-free checks the x86_64 client runs (game
    # window test, the client's start from temporary trees with no game data,
    # the Bink shim) and the scalar skinning test Arm depends on. Nothing here
    # draws a frame or reads game data. The x86 client jobs are untouched.
    name: aarch64 multiplayer client
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      BUILD_DIR: build-arm64/mp-client
      OUT_DIR: ${{ github.workspace }}/out/arm64-mp-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install aarch64 build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          # libopenal-dev only for <AL/al.h>; the client links the OpenAL stand-in.
          # libavcodec-dev and libavutil-dev for the Bink shim the client is
          # built with here (KISAK_LINUX_CINEMATICS, docs/linux-cinematics.md).
          scripts/ci/apt-install.sh \
            cmake ninja-build clang binutils python3 ccache libopenal-dev \
            libavcodec-dev libavutil-dev

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-arm64-mp-client-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-arm64-mp-client-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Restore pinned aarch64 SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-aarch64-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}

      - name: Build pinned aarch64 SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same pin and options as the x86 client jobs, built natively.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | grep -Eq 'Machine:[[:space:]]+AArch64'

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as the x86 client jobs. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the aarch64 multiplayer client against the stand-ins
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stand-ins"
          d3d9="$RUNNER_TEMP/stand-ins/libd3d9_unavailable.so"
          openal="$RUNNER_TEMP/stand-ins/libopenal_unavailable.so"
          clang++ -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libd3d9_unavailable.so \
            tests/linux_device_probe/d3d9_unavailable.cpp -o "$d3d9"
          clang++ -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libopenal_unavailable.so \
            tests/linux_mp_client/openal_unavailable.cpp -o "$openal"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=aarch64 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_DXVK_NATIVE_LIBRARY="$d3d9" \
            -DKISAK_BUILD_LINUX_MP_CLIENT=ON -DKISAK_OPENAL_LIBRARY="$openal" \
            -DKISAK_LINUX_CINEMATICS=ON \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "$BUILD_DIR" --target KisakCOD-mp KisakCOD-mp-client-window-test \
            KisakCOD-native-d3d9-proofs KisakCOD-bink-shim-test KisakCOD-skin-scalar-test \
            --parallel "$(nproc)"
          for binary in "$OUT_DIR/KisakCOD-mp" "$OUT_DIR/KisakCOD-mp-client-window-test"; do
            readelf -h "$binary" | grep -Eq 'Class:[[:space:]]+ELF64'
            readelf -h "$binary" | grep -Eq 'Machine:[[:space:]]+AArch64'
          done
          readelf -d "$OUT_DIR/KisakCOD-mp" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          cat "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          grep -qx 'libopenal_unavailable.so' "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          grep -Eqx 'libavcodec\.so\.[0-9]+' "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          grep -Eqx 'libavutil\.so\.[0-9]+' "$RUNNER_TEMP/arm64-mp-client-needed.txt"
          # Arm glibc keeps the stack-protector canary (__stack_chk_guard) in the
          # dynamic loader, so a -fstack-protector build lists it too.
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libopenal_unavailable\.so|libavcodec\.so\.[0-9]+|libavutil\.so\.[0-9]+|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2|ld-linux-aarch64\.so\.1)$' \
              "$RUNNER_TEMP/arm64-mp-client-needed.txt"; then
            echo "the multiplayer client needs a library beyond SDL3, D3D9, OpenAL, libavcodec and the runtimes" >&2
            exit 1
          fi
          if nm -D --defined-only "$OUT_DIR/KisakCOD-mp" | awk '{print $3}' | grep -vx '_IO_stdin_used'; then
            echo "the multiplayer client exports names to shared libraries" >&2
            exit 1
          fi
          # Arm must not fuse multiply-adds (-ffp-contract=off): float results
          # have to match x86 (docs/linux-arm64.md).
          if objdump -d "$OUT_DIR/KisakCOD-mp" | grep -Eq $'\t(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\\b'; then
            echo "the client contains fused multiply-add instructions" >&2
            exit 1
          fi

      - name: Run the aarch64 multiplayer client's fail-closed start
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/stand-ins"
          "$OUT_DIR/KisakCOD-mp-client-window-test"
          python3 -u scripts/tests/test_linux_mp_client.py --binary "$OUT_DIR/KisakCOD-mp"

      - name: Run the Bink shim's asset-free test
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          LD_LIBRARY_PATH="$RUNNER_TEMP/stand-ins" "$OUT_DIR/KisakCOD-bink-shim-test"

      # Arm skins with the engine's scalar code; its output must be the bytes
      # every architecture produces (tests/skinning/skin_scalar_test.cpp).
      - name: Run the scalar skinning check
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$OUT_DIR/KisakCOD-skin-scalar-test"

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-arm64-mp-client-${{ github.run_id }}-${{ github.run_attempt }}

  world_frontend:
    # Asset-free CPU test of the production renderer world front end: scene and
    # view setup, DPVS cell/portal visibility, the AABB-tree and cull-group walk,
    # BSP draw-surface batching and the merge, run against a synthetic world. The
    # runner compiles the test, its link boundary and an explicit list of
    # unmodified production units with one -m32 compiler line and links with
    # --gc-sections. r_scene.cpp and r_buffers.cpp call the D3D9 API, so they are
    # compiled through the native D3D9 boundary against the same pinned DXVK
    # Native 2.7.1 *headers* as native_d3d9_boundary: no DXVK build or library, no
    # D3D9 call, no CMake configure, no engine build, no SDL, no GPU, no game data.
    # OpenAL headers are needed because client sound headers include <AL/al.h>.
    name: Asset-free world front-end checks ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install world front-end tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake clang g++-multilib python3 python3-yaml libopenal-dev
          clang++ --version
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          clang++ -m32 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as native_d3d9_boundary: DXVK v2.7.1 and
          # the mingw-directx-headers revision it records. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"

      - name: Check world front-end runner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_world_frontend_check_runner.py

      - name: Run world front-end checks
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_world_frontend_checks.py \
            --config "${{ matrix.config }}" \
            --cxx clang++ --jobs 4 \
            --dxvk-source "$RUNNER_TEMP/dxvk-source" \
            --log-dir "artifacts/world-frontend-${{ matrix.config }}" \
            2>&1 | tee "artifacts/world-frontend-${{ matrix.config }}.log"

      - name: Upload world front-end logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Compiler, link and test output only; the runner builds in a
          # temporary directory it removes, so no binary is uploaded.
          name: KisakCOD-world-frontend-${{ matrix.config }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  world_surface:
    # Asset-free: builds seven standalone -m32 test cases directly
    # and runs the bundle prepare tests. No DXVK, no SDL, no GPU, no game assets,
    # no CMake configure. tests/linux_renderer/CMakeLists.txt is deliberately not
    # used here: it requires the dxvk-d3d9 and sdl3 pkg-config modules before it
    # configures anything, so it cannot serve a check that must not need them.
    name: Asset-free world surface checks ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install 32-bit C++ toolchain
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh g++ g++-multilib python3

      - name: Verify the 32-bit C++20 toolchain
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          g++ --version
          python3 --version
          echo "target architecture probe:"
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          g++ -m32 -std=c++20 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"
          echo "32-bit C++20 link works"

      - name: Check world surface runner configuration and failure handling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_world_surface_check_runner.py

      - name: Run asset-free world surface checks
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # pipefail is what carries the runner's exit status through tee, so a
          # failed check fails the step instead of only decorating its log.
          python3 -u scripts/tests/run_world_surface_checks.py \
            --config "${{ matrix.config }}" \
            --cxx g++ \
            --log-dir "artifacts/world-surface-${{ matrix.config }}" \
            2>&1 | tee "artifacts/world-surface-${{ matrix.config }}.log"

      - name: Upload world surface check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Text logs only: the compiled test binaries live in a temporary
          # directory that the runner removes, so nothing binary is uploaded.
          name: KisakCOD-world-surface-${{ matrix.config }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  native_d3d9_boundary:
    # The opt-in native D3D9 boundary (src/linux/d3d9_native.h) against the pinned
    # DXVK Native 2.7.1 *headers*. DXVK is fetched as source and only its headers
    # are used: no DXVK build, no libdxvk_d3d9.so, no Vulkan, no SDL, no GPU, no
    # device and no game assets. The CMake configure fetches Tracy, like the
    # native job. Nothing here runs the dedicated server or changes its build.
    # The last build step links the opt-in offline world front-end probe on top of
    # the boundary and runs its asset-free invariants test; the probe itself is
    # not run, because running it needs a game install.
    name: Native D3D9 boundary ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      BUILD_DIR: build-linux/native-d3d9-${{ matrix.config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install 32-bit C++ toolchains
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh \
            cmake ninja-build clang g++ g++-multilib binutils python3 ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-d3d9-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-native-d3d9-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Verify the 32-bit toolchains
        shell: bash
        run: |
          set -euo pipefail
          g++ --version
          clang++ --version
          objdump --version | head -n 1
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          for cxx in g++ clang++; do
            "$cxx" -m32 -std=c++20 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
            "$RUNNER_TEMP/m32-probe"
            echo "$cxx: 32-bit C++20 link works"
          done

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # DXVK v2.7.1 and the mingw-directx-headers revision it records for
          # include/native/directx. Source only; nothing is configured or built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"

      - name: Check native D3D9 runner configuration and failure handling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_native_d3d9_boundary_runner.py

      - name: Run asset-free native D3D9 boundary checks
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_native_d3d9_boundary_checks.py \
            --config "${{ matrix.config }}" \
            --dxvk-source "$RUNNER_TEMP/dxvk-source" \
            --header-cxx g++ --header-cxx clang++ --engine-cxx clang++ \
            --log-dir "artifacts/native-d3d9-${{ matrix.config }}" \
            2>&1 | tee "artifacts/native-d3d9-${{ matrix.config }}.log"

      - name: Configure and build the opt-in CMake boundary proofs
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$RUNNER_TEMP/dxvk-source" \
            --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/out/native-d3d9-${{ matrix.config }}" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            2>&1 | tee "artifacts/native-d3d9-cmake-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-native-d3d9-proofs --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/native-d3d9-cmake-${{ matrix.config }}.log"
          out="$GITHUB_WORKSPACE/out/native-d3d9-${{ matrix.config }}"
          "$out/KisakCOD-native-d3d9-boundary-check"
          "$out/KisakCOD-native-d3d9-layout-standin" > "$RUNNER_TEMP/layout-standin.txt"
          "$out/KisakCOD-native-d3d9-layout-native" > "$RUNNER_TEMP/layout-native.txt"
          # Only the first (mode) line may differ between the two views.
          diff <(tail -n +2 "$RUNNER_TEMP/layout-standin.txt") <(tail -n +2 "$RUNNER_TEMP/layout-native.txt")
          tail -n 1 "$RUNNER_TEMP/layout-native.txt" | grep -qx 'PASS engine D3D9 layouts'

      - name: Build the offline world front-end probe
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # Link proof for the opt-in probe (scripts/platform/linux/
          # world_frontend_probe.cmake): the asset exporter with the production
          # renderer front end linked in. It is only built and inspected here;
          # running it needs a game install, which CI never has or looks for.
          cmake -S . -B "$BUILD_DIR" -DKISAK_BUILD_WORLD_FRONTEND_PROBE=ON \
            2>&1 | tee "artifacts/world-frontend-probe-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" \
            --target KisakCOD-world-frontend-probe KisakCOD-world-frontend-invariants-test --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/world-frontend-probe-${{ matrix.config }}.log"
          out="$GITHUB_WORKSPACE/out/native-d3d9-${{ matrix.config }}"
          "$out/KisakCOD-world-frontend-invariants-test"
          probe="$out/KisakCOD-world-frontend-probe"
          readelf -h "$probe" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$probe" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          # The probe creates no device: it may need the C and C++ runtimes and
          # nothing else.
          readelf -d "$probe" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/probe-needed.txt"
          cat "$RUNNER_TEMP/probe-needed.txt"
          if grep -Ev '^(libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/probe-needed.txt"; then
            echo "the offline probe needs a library beyond the C and C++ runtimes" >&2
            exit 1
          fi

      - name: Upload native D3D9 boundary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Text logs only: the runner's binaries live in a temporary directory it
          # removes, and the CMake build directory is not uploaded.
          name: KisakCOD-native-d3d9-${{ matrix.config }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-native-d3d9-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  device_probe:
    # The opt-in D3D9 device probe (scripts/platform/linux/device_probe.cmake)
    # without a GPU: the engine's r_init.cpp linked through the native D3D9
    # boundary (pinned DXVK Native 2.7.1 *headers*) with the Win32 window layer
    # over the pinned SDL3. There is no Vulkan driver and no DXVK library here:
    # the probe links tests/linux_device_probe/d3d9_unavailable.cpp, a stand-in
    # whose Direct3DCreate9 answers like DXVK's does without a Vulkan device. So
    # this job proves the link closure, runs the Win32 layer's asset-free test on
    # SDL's dummy video driver, and runs the probe to its fail-closed result.
    # The world device probe (scripts/platform/linux/world_device_probe.cmake,
    # the asset exporter with r_init.cpp, the image and material loaders and the
    # world front end on a D3D9 device) gets the same treatment: linked against
    # the stand-in, then run by scripts/tests/test_world_device_probe.py from a
    # temporary tree with no game data, so it must stop at Direct3DCreate9 and
    # refuse a missing or unknown map before any zone loads. The world draw
    # probe (scripts/platform/linux/world_draw_probe.cmake, the whole renderer
    # drawing views of a map) is built and run the same way by
    # scripts/tests/test_world_draw_probe.py. Creating a device, loading a map
    # onto it and drawing it need a GPU and a game install, and run on a
    # developer machine. The multiplayer client KisakCOD-mp
    # (scripts/platform/linux/mp_client.cmake) is built in the same directory
    # with an OpenAL stand-in as well, and run by
    # scripts/tests/test_linux_mp_client.py from temporary trees with no game
    # data, where it must stop at the file system check or at autoconfigure.
    # The singleplayer game KisakCOD-sp (scripts/platform/linux/sp_game.cmake)
    # is built and run the same way by scripts/tests/test_linux_sp_game.py.
    name: D3D9 device probe without a GPU ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      BUILD_DIR: build-linux/device-probe-${{ matrix.config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install 32-bit C++ toolchain
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libopenal-dev only for <AL/al.h>, which the multiplayer client's
          # sound headers include; the client links the OpenAL stand-in.
          scripts/ci/apt-install.sh \
            cmake ninja-build clang g++ g++-multilib binutils python3 ccache libopenal-dev

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-device-probe-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-device-probe-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Restore pinned 32-bit SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-i386-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}

      - name: Build pinned 32-bit SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # A restored SDK (same pin, same options: the cache key changes with
          # this file) skips the build; the checks below run either way.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            # SDL release-3.2.10, the same pin and options as the window job.
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF \
              2>&1 | tee artifacts/sdl3-configure.log
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | tee artifacts/sdl3-elf.log
          grep -q ELF32 artifacts/sdl3-elf.log

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as native_d3d9_boundary: DXVK v2.7.1 and
          # the mingw-directx-headers revision it records. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the device probe against the stand-in D3D9 library
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts "$RUNNER_TEMP/d3d9-unavailable"
          stand_in="$RUNNER_TEMP/d3d9-unavailable/libd3d9_unavailable.so"
          clang++ -m32 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libd3d9_unavailable.so \
            tests/linux_device_probe/d3d9_unavailable.cpp -o "$stand_in"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_DXVK_NATIVE_LIBRARY="$stand_in" \
            -DKISAK_BUILD_DEVICE_PROBE=ON \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3" \
            2>&1 | tee "artifacts/device-probe-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-device-probe KisakCOD-win32-window-test --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/device-probe-${{ matrix.config }}.log"
          out="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}"
          for binary in "$out/KisakCOD-device-probe" "$out/KisakCOD-win32-window-test"; do
            readelf -h "$binary" | grep -Eq 'Class:[[:space:]]+ELF32'
            readelf -h "$binary" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          done
          # The probe needs SDL3 and the D3D9 library; the Win32 layer's test
          # needs SDL3 and not the D3D9 library.
          readelf -d "$out/KisakCOD-device-probe" | grep -F 'Shared library: [libSDL3.so.0]'
          readelf -d "$out/KisakCOD-device-probe" | grep -F 'Shared library: [libd3d9_unavailable.so]'
          readelf -d "$out/KisakCOD-win32-window-test" | grep -F 'Shared library: [libSDL3.so.0]'
          if readelf -d "$out/KisakCOD-win32-window-test" | grep -F 'libd3d9_unavailable'; then
            echo "the Win32 layer's test must not need the D3D9 library" >&2
            exit 1
          fi

      - name: Run the Win32 window layer test and the probe's fail-closed path
        timeout-minutes: 5
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/d3d9-unavailable"
          "$out/KisakCOD-win32-window-test" 2>&1 | tee "artifacts/win32-window-test-${{ matrix.config }}.log"
          status=0
          "$out/KisakCOD-device-probe" > "artifacts/device-probe-run-${{ matrix.config }}.log" 2>&1 || status=$?
          cat "artifacts/device-probe-run-${{ matrix.config }}.log"
          # Without a D3D9 implementation the probe must stop at Direct3DCreate9,
          # after the engine runtime came up, and say so on its last line.
          test "$status" -eq 1
          grep -q '^engine_runtime=ready dvars=registered r_fullscreen=0 r_customMode=640x480' \
            "artifacts/device-probe-run-${{ matrix.config }}.log"
          grep -qx 'Direct3D 9 failed to initialize' "artifacts/device-probe-run-${{ matrix.config }}.log"
          tail -n 1 "artifacts/device-probe-run-${{ matrix.config }}.log" | grep -q '^device_probe=failed stage=direct3d '
          # A usage error is its own status.
          status=0
          "$out/KisakCOD-device-probe" --frames 0 > /dev/null 2>&1 || status=$?
          test "$status" -eq 2

      - name: Build the world device probe against the stand-in D3D9 library
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # The same build directory, with the two probes the world device probe
          # builds on switched on. Only built and inspected here.
          cmake -S . -B "$BUILD_DIR" \
            -DKISAK_BUILD_WORLD_FRONTEND_PROBE=ON -DKISAK_BUILD_WORLD_DEVICE_PROBE=ON \
            2>&1 | tee "artifacts/world-device-probe-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-world-device-probe --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/world-device-probe-${{ matrix.config }}.log"
          probe="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-world-device-probe"
          readelf -h "$probe" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$probe" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          # SDL3, the D3D9 library and the C and C++ runtimes, nothing else.
          readelf -d "$probe" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/world-device-needed.txt"
          cat "$RUNNER_TEMP/world-device-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/world-device-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/world-device-needed.txt"
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/world-device-needed.txt"; then
            echo "the world device probe needs a library beyond SDL3, D3D9 and the runtimes" >&2
            exit 1
          fi

      - name: Run the world device probe's fail-closed paths
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/d3d9-unavailable"
          # The script starts the engine from a temporary tree that holds only a
          # one-line stub of the file the engine checks for, so it reaches the
          # probe with no game data. An allowlisted map must stop at
          # Direct3DCreate9 before any zone is queued; no map and an unknown map
          # must be refused first. Nothing may land in the output directories.
          python3 -u scripts/tests/test_world_device_probe.py \
            --probe "$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-world-device-probe" \
            2>&1 | tee "artifacts/world-device-run-${{ matrix.config }}.log"

      - name: Build the world draw probe against the stand-in D3D9 library
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # The same build directory again, with the draw probe on top of the
          # world device probe: the whole renderer except the four units the
          # client census still blocks. Only built and inspected here.
          cmake -S . -B "$BUILD_DIR" -DKISAK_BUILD_WORLD_DRAW_PROBE=ON \
            2>&1 | tee "artifacts/world-draw-probe-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-world-draw-probe --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/world-draw-probe-${{ matrix.config }}.log"
          probe="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-world-draw-probe"
          readelf -h "$probe" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$probe" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          # SDL3, the D3D9 library and the C and C++ runtimes, nothing else.
          readelf -d "$probe" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/world-draw-needed.txt"
          cat "$RUNNER_TEMP/world-draw-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/world-draw-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/world-draw-needed.txt"
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/world-draw-needed.txt"; then
            echo "the world draw probe needs a library beyond SDL3, D3D9 and the runtimes" >&2
            exit 1
          fi

      - name: Run the world draw probe's fail-closed paths
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/d3d9-unavailable"
          # The same temporary tree with no game data as the world device probe's
          # run. An allowlisted map must stop at Direct3DCreate9 before R_Init
          # starts the renderer; no map, an unknown map and a show time over 60
          # seconds must be refused first. The free-camera replay and window
          # driver must stop the same way and refuse their own bad arguments.
          # Nothing may land in the output directories.
          python3 -u scripts/tests/test_world_draw_probe.py \
            --probe "$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-world-draw-probe" \
            2>&1 | tee "artifacts/world-draw-run-${{ matrix.config }}.log"

      - name: Build the multiplayer client against the stand-in D3D9 and OpenAL libraries
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          # KisakCOD-mp (scripts/platform/linux/mp_client.cmake): the whole game
          # in one i386 process, its renderer units through the native D3D9
          # boundary. It links the same D3D9 stand-in as the probes and an
          # OpenAL stand-in whose alcOpenDevice finds no device, so no OpenAL
          # library is installed (only its headers). Only built and inspected
          # here. Its game window's asset-free test is built beside it.
          mkdir -p "$RUNNER_TEMP/openal-unavailable"
          openal="$RUNNER_TEMP/openal-unavailable/libopenal_unavailable.so"
          clang++ -m32 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libopenal_unavailable.so \
            tests/linux_mp_client/openal_unavailable.cpp -o "$openal"
          # The Debug build also turns on the opt-in Tracy profiler, so the
          # profiling build compiles and links on every push; RelWithDebInfo
          # stays the player build with no profiler.
          tracy=OFF
          if [ "${{ matrix.config }}" = Debug ]; then tracy=ON; fi
          cmake -S . -B "$BUILD_DIR" -DKISAK_BUILD_LINUX_MP_CLIENT=ON -DKISAK_OPENAL_LIBRARY="$openal" \
            -DKISAK_LINUX_TRACY="$tracy" \
            2>&1 | tee "artifacts/mp-client-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-mp KisakCOD-mp-client-window-test --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/mp-client-${{ matrix.config }}.log"
          window_test="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-mp-client-window-test"
          readelf -h "$window_test" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -d "$window_test" | grep -F 'Shared library: [libSDL3.so.0]'
          if readelf -d "$window_test" | grep -F 'libd3d9_unavailable'; then
            echo "the game window test must not link a D3D9 library" >&2
            exit 1
          fi
          client="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-mp"
          readelf -h "$client" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$client" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          # SDL3, the D3D9 and OpenAL libraries and the C and C++ runtimes.
          readelf -d "$client" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/mp-client-needed.txt"
          cat "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx 'libopenal_unavailable.so' "$RUNNER_TEMP/mp-client-needed.txt"
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libopenal_unavailable\.so|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/mp-client-needed.txt"; then
            echo "the multiplayer client needs a library beyond SDL3, D3D9, OpenAL and the runtimes" >&2
            exit 1
          fi
          # No game name is exported to the libraries it loads
          # (scripts/platform/linux/mp_client_exports.map).
          if nm -D --defined-only "$client" | awk '{print $3}' | grep -vx '_IO_stdin_used'; then
            echo "the multiplayer client exports names to shared libraries" >&2
            exit 1
          fi

      - name: Run the multiplayer client's fail-closed start
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/d3d9-unavailable:$RUNNER_TEMP/openal-unavailable"
          # The game window on SDL's dummy driver: adopted when the renderer's
          # window is made and let go before it is destroyed, keys into the
          # engine queue, one mouse report per frame, focus and close.
          "$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-mp-client-window-test" \
            2>&1 | tee "artifacts/mp-client-window-test-${{ matrix.config }}.log"
          # The script starts the client from temporary trees with no game data:
          # an empty one must be refused at the file system check, one holding a
          # stub of the file the engine checks for must stop at the client's
          # autoconfigure step for want of a game file. No connection is tried.
          python3 -u scripts/tests/test_linux_mp_client.py \
            --binary "$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-mp" \
            2>&1 | tee "artifacts/mp-client-run-${{ matrix.config }}.log"

      - name: Build the singleplayer game against the stand-in D3D9 and OpenAL libraries
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          # KisakCOD-sp (scripts/platform/linux/sp_game.cmake): the singleplayer
          # game from the KisakCOD-sp source lists, built like KisakCOD-mp in the
          # same directory with the same stand-ins. Only built and inspected here.
          openal="$RUNNER_TEMP/openal-unavailable/libopenal_unavailable.so"
          cmake -S . -B "$BUILD_DIR" -DKISAK_BUILD_LINUX_SP_GAME=ON -DKISAK_OPENAL_LIBRARY="$openal" \
            2>&1 | tee "artifacts/sp-game-${{ matrix.config }}.log"
          cmake --build "$BUILD_DIR" --target KisakCOD-sp --parallel "$(nproc)" \
            2>&1 | tee -a "artifacts/sp-game-${{ matrix.config }}.log"
          game="$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-sp"
          readelf -h "$game" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$game" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          readelf -d "$game" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' > "$RUNNER_TEMP/sp-game-needed.txt"
          cat "$RUNNER_TEMP/sp-game-needed.txt"
          grep -qx 'libSDL3.so.0' "$RUNNER_TEMP/sp-game-needed.txt"
          grep -qx 'libd3d9_unavailable.so' "$RUNNER_TEMP/sp-game-needed.txt"
          grep -qx 'libopenal_unavailable.so' "$RUNNER_TEMP/sp-game-needed.txt"
          if grep -Ev '^(libSDL3\.so\.0|libd3d9_unavailable\.so|libopenal_unavailable\.so|libstdc\+\+\.so\.6|libm\.so\.6|libgcc_s\.so\.1|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2)$' \
              "$RUNNER_TEMP/sp-game-needed.txt"; then
            echo "the singleplayer game needs a library beyond SDL3, D3D9, OpenAL and the runtimes" >&2
            exit 1
          fi
          if nm -D --defined-only "$game" | awk '{print $3}' | grep -vx '_IO_stdin_used'; then
            echo "the singleplayer game exports names to shared libraries" >&2
            exit 1
          fi

      - name: Run the singleplayer game's fail-closed start
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/d3d9-unavailable:$RUNNER_TEMP/openal-unavailable"
          # From temporary trees with no game data: an empty one must be refused
          # at the file system check, a stub one must stop at autoconfigure for
          # want of configure.csv.
          python3 -u scripts/tests/test_linux_sp_game.py \
            --binary "$GITHUB_WORKSPACE/out/device-probe-${{ matrix.config }}/KisakCOD-sp" \
            2>&1 | tee "artifacts/sp-game-run-${{ matrix.config }}.log"

      - name: Upload device probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Text logs only; no binary and no build directory is uploaded.
          name: KisakCOD-device-probe-${{ matrix.config }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-device-probe-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  free_camera:
    # Asset-free: the host free camera and its frame owner, compiled as two
    # standalone -m32 tests with Clang and the production Linux flags, linked
    # against the unmodified production AnglesToAxis unit. The renderer is a
    # recording fake: no DXVK, no SDL, no GPU, no game assets, no CMake configure.
    name: Asset-free free camera checks ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install 32-bit Clang toolchain
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh clang g++-multilib python3

      - name: Verify the 32-bit C++20 toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang++ --version
          python3 --version
          echo "target architecture probe:"
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          clang++ -m32 -std=c++20 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"
          echo "32-bit C++20 link works"

      - name: Check free camera runner configuration and failure handling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_free_camera_check_runner.py

      - name: Run asset-free free camera checks
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/run_free_camera_checks.py \
            --config "${{ matrix.config }}" \
            --cxx clang++ \
            --log-dir "artifacts/free-camera-${{ matrix.config }}" \
            2>&1 | tee "artifacts/free-camera-${{ matrix.config }}.log"

      - name: Upload free camera check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Text logs only; the runner removes its temporary binaries.
          name: KisakCOD-free-camera-${{ matrix.config }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  vulkan_window:
    # Opt-in Vulkan back end (docs/vulkan-core.md): the shared Vulkan core in
    # src/gfx_vk and KisakCOD-vulkan-probe, which opens an SDL3 window and
    # clears, presents and resizes it through the core, then draws a small
    # textured scene through the core's resource paths and checks its pixels,
    # the Legacy shader translator (KisakCOD-vulkan-shaders), the Legacy
    # adapter's pixel check (KisakCOD-vulkan-legacy-check,
    # docs/vulkan-legacy-adapter.md) and the check of its D3D9 front
    # (KisakCOD-vulkan-d3d9-check, docs/vulkan-d3d9-front.md). Built for
    # x86_64, the primary Vulkan target, against the x86_64 SDL3 pin (same
    # options and cache key as x64_client). The D3D9 front compiles against the
    # renderer's own D3D9 declarations, so DXVK Native's headers are staged (the
    # same pin as x64_client); no DXVK library is built or linked. It runs on
    # Mesa's lavapipe, a CPU Vulkan driver, through SDL's offscreen video driver
    # (VK_EXT_headless_surface): no GPU, no display server, no game data. The
    # validation layer is required, with synchronisation checks, and any error
    # fails the job.
    name: Vulkan window probe on lavapipe ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      BUILD_DIR: build-x64/vulkan-probe-${{ matrix.config }}
      OUT_DIR: ${{ github.workspace }}/out/vulkan-probe-${{ matrix.config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install x86_64 build tools and the lavapipe Vulkan driver
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libvulkan-dev for the headers (the probe does not link the loader;
          # SDL3 opens it), mesa-vulkan-drivers for lavapipe,
          # vulkan-validationlayers for the required validation run,
          # spirv-tools to validate the probe's checked-in SPIR-V.
          scripts/ci/apt-install.sh \
            cmake ninja-build clang binutils python3 ccache \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers spirv-tools

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vulkan-window-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vulkan-window-${{ matrix.config }}-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Restore pinned x86_64 SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-x86_64-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}

      - name: Build pinned x86_64 SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same pin and options as the x86_64 client job, so the two share
          # the cached SDK. X11 and Wayland are off: the probe uses SDL's
          # offscreen driver, which supports Vulkan through headless surfaces.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
              -DCMAKE_C_FLAGS=-m64 -DCMAKE_SHARED_LINKER_FLAGS=-m64 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | grep -Eq 'Class:[[:space:]]+ELF64'

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Headers only, for the D3D9 front: the same source-only fetch as the
          # x86_64 client job. Nothing of DXVK is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the Vulkan window probe
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=x86_64 \
            -DCMAKE_BUILD_TYPE="${{ matrix.config }}" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_VULKAN_PROBE=ON -DKISAK_BUILD_VULKAN_SHADERS=ON \
            -DKISAK_BUILD_VULKAN_LEGACY=ON \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3"
          cmake --build "$BUILD_DIR" \
            --target KisakCOD-vulkan-probe KisakCOD-vulkan-shaders KisakCOD-vulkan-legacy-check \
            KisakCOD-vulkan-d3d9-check \
            --parallel "$(nproc)"
          for tool in KisakCOD-vulkan-probe KisakCOD-vulkan-legacy-check KisakCOD-vulkan-d3d9-check; do
            readelf -h "$OUT_DIR/$tool" | grep -Eq 'Class:[[:space:]]+ELF64'
            # The loader is opened at run time through SDL, never linked, and
            # no D3D9 library is: the front is the D3D9 implementation.
            if readelf -d "$OUT_DIR/$tool" | grep -Eq 'libvulkan|d3d9|dxvk'; then
              echo "$tool must not link libvulkan or a D3D9 library" >&2
              exit 1
            fi
          done

      - name: Check the probe's generated SPIR-V header
        shell: bash
        run: |
          set -euo pipefail
          # vk_probe_shaders.h is generated from src/gfx_vk/tools/shaders: each
          # source's hash must match the header, and the words must pass spirv-val.
          python3 scripts/tools/vulkan/gen_spirv_header.py --check
          # vk_legacy_check_shaders.h is the Legacy check's D3D9 shaders,
          # assembled from the assembly in the script; rebuilt and compared.
          python3 scripts/tools/vulkan/gen_legacy_check_shaders.py --check

      - name: Run the Vulkan window probe on lavapipe
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 -u scripts/tests/test_vulkan_window_probe.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-probe" \
            --video-driver offscreen --validation require

      - name: Check the Legacy shader translator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # dxbc-spirv (fetched at a pinned commit) and our lowering, on the
          # shader spike's 81 test shaders: valid SPIR-V for Vulkan 1.3 with
          # scalar block layout, predication refused, uniform block layouts,
          # reflection and linking (docs/vulkan-legacy-shaders.md).
          python3 -u scripts/tests/test_vulkan_legacy_shaders.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-shaders"

      - name: Run the Legacy adapter check on lavapipe
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # D3D9-style scenes drawn through the Legacy adapter (translation,
          # pipelines, descriptors, textures, buffers, render state, queries)
          # and checked pixel by pixel, with the validation layer required.
          python3 -u scripts/tests/test_vulkan_legacy_adapter.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-legacy-check" \
            --video-driver offscreen --validation require

      - name: Run the D3D9 front check on lavapipe
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # The adapter driven through IDirect3D9 and IDirect3DDevice9, as the
          # renderer calls it: pixels, reference counts, state getters,
          # queries, Reset, Present and teardown, with validation required.
          python3 -u scripts/tests/test_vulkan_d3d9_front.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-d3d9-check" \
            --video-driver offscreen --validation require

      - name: Run both checks again on MoltenVK's paths
        if: ${{ matrix.config == 'Debug' }}
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          # The paths the adapter takes on MoltenVK (docs/vulkan-legacy-adapter.md):
          # strides baked into pipelines, depth compare fixed per pipeline and
          # 16-bit packed render targets made as B8G8R8A8, here with the
          # validation layer required. Also plain uniform buffers, the path a
          # layout takes past the device's dynamic uniform buffer limit.
          KISAK_VK_VERTEX_STRIDE: static
          KISAK_VK_DEPTH_COMPARE: fixed
          KISAK_VK_RENDER_TARGETS: wide
          KISAK_VK_UNIFORMS: static
        run: |
          set -euo pipefail
          python3 -u scripts/tests/test_vulkan_legacy_adapter.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-legacy-check" \
            --video-driver offscreen --validation require
          python3 -u scripts/tests/test_vulkan_d3d9_front.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-d3d9-check" \
            --video-driver offscreen --validation require

      - name: Check the D3D9 front's lock with ThreadSanitizer
        if: ${{ matrix.config == 'Debug' }}
        timeout-minutes: 15
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          # The renderer calls D3D9 from several threads; the check's threads
          # scene does too (a worker creates and fills textures while this
          # thread draws). Built with ThreadSanitizer, any data race in the
          # front, the adapter or the core fails the run. Lavapipe itself is
          # not instrumented.
          tsan_build="build-x64/vulkan-probe-tsan"
          cmake -S . -B "$tsan_build" -G Ninja \
            -DKISAK_PLATFORM=linux -DKISAK_LINUX_ARCH=x86_64 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR/tsan" \
            -DKISAK_BUILD_VULKAN_PROBE=ON -DKISAK_BUILD_VULKAN_SHADERS=ON \
            -DKISAK_BUILD_VULKAN_LEGACY=ON \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3"
          cmake --build "$tsan_build" --target KisakCOD-vulkan-d3d9-check --parallel "$(nproc)"
          "$OUT_DIR/tsan/KisakCOD-vulkan-d3d9-check" --scene threads --validation off | tee "$RUNNER_TEMP/tsan.log"
          grep -qx 'd3d9_check=passed' "$RUNNER_TEMP/tsan.log"

      - name: Check the frame comparison script
        shell: bash
        run: |
          set -euo pipefail
          # scripts/tools/vulkan/compare_frames.py compares the world draw
          # probe's frames from the two back ends on a developer machine.
          python3 scripts/tests/test_compare_frames.py

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vulkan-window-${{ matrix.config }}-${{ github.run_id }}-${{ github.run_attempt }}

  vulkan_engine:
    # The engine's renderer on the Vulkan back end (docs/vulkan-d3d9-front.md):
    # the device probe, the world draw probe and the multiplayer client built
    # i386 with KISAK_BUILD_VULKAN_BACKEND, so r_backend vulkan makes
    # R_HW_Direct3DCreate9 return the Vulkan D3D9 front. The device probe then
    # runs the engine's own r_init.cpp (R_PreCreateWindow, R_CreateWindow,
    # R_CreateDevice) on Mesa's i386 lavapipe through SDL's offscreen driver,
    # clears, reads back, presents and releases, and must reach no method the
    # front leaves unsupported. The front's own check runs on the same driver.
    # Ubuntu ships no i386 validation layer, so validation runs in vulkan_window
    # (x86_64) only. The programs link the same stand-in D3D9 and OpenAL
    # libraries as device_probe; no DXVK library is built and no game data is
    # read. Drawing a map needs a GPU and a game install and runs on a
    # developer machine.
    name: Engine on the Vulkan back end (i386, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      BUILD_DIR: build-linux/vulkan-engine
      OUT_DIR: ${{ github.workspace }}/out/vulkan-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install 32-bit C++ toolchain and the i386 lavapipe Vulkan driver
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libvulkan-dev for the headers (nothing links the loader; SDL3 opens
          # it), the i386 loader and lavapipe to run on, libopenal-dev only for
          # <AL/al.h> (the client links the OpenAL stand-in).
          sudo dpkg --add-architecture i386
          scripts/ci/apt-install.sh \
            cmake ninja-build clang g++ g++-multilib binutils python3 ccache libopenal-dev \
            libvulkan-dev libvulkan1:i386 mesa-vulkan-drivers:i386

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vulkan-engine-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vulkan-engine-
      - name: Use compiler cache
        id: ccache
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Restore pinned 32-bit SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-i386-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-linux.yaml') }}

      - name: Build pinned 32-bit SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same pin and options as device_probe, so the two share the
          # cached SDK. Its offscreen driver makes Vulkan windows through
          # VK_EXT_headless_surface.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(nproc)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          readelf -h "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.so.0" | grep -q ELF32

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Headers only, as in device_probe: the renderer's D3D9 declarations.
          # Nothing of DXVK is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the engine's programs with the Vulkan back end
        timeout-minutes: 50
        shell: bash
        run: |
          set -euo pipefail
          stubs="$RUNNER_TEMP/stand-ins"
          mkdir -p "$stubs"
          clang++ -m32 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libd3d9_unavailable.so \
            tests/linux_device_probe/d3d9_unavailable.cpp -o "$stubs/libd3d9_unavailable.so"
          clang++ -m32 -shared -fPIC -Wall -Wextra -Werror -Wl,-soname,libopenal_unavailable.so \
            tests/linux_mp_client/openal_unavailable.cpp -o "$stubs/libopenal_unavailable.so"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_DXVK_NATIVE_LIBRARY="$stubs/libd3d9_unavailable.so" \
            -DKISAK_OPENAL_LIBRARY="$stubs/libopenal_unavailable.so" \
            -DKISAK_BUILD_DEVICE_PROBE=ON -DKISAK_BUILD_WORLD_FRONTEND_PROBE=ON \
            -DKISAK_BUILD_WORLD_DEVICE_PROBE=ON -DKISAK_BUILD_WORLD_DRAW_PROBE=ON \
            -DKISAK_BUILD_LINUX_MP_CLIENT=ON \
            -DKISAK_BUILD_VULKAN_PROBE=ON -DKISAK_BUILD_VULKAN_SHADERS=ON \
            -DKISAK_BUILD_VULKAN_LEGACY=ON -DKISAK_BUILD_VULKAN_BACKEND=ON \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3" \
            2>&1 | tee "$RUNNER_TEMP/configure.log"
          for program in KisakCOD-device-probe KisakCOD-world-draw-probe KisakCOD-mp; do
            grep -qx -- "-- Vulkan back end: linked into $program" "$RUNNER_TEMP/configure.log"
          done
          cmake --build "$BUILD_DIR" \
            --target KisakCOD-device-probe KisakCOD-vulkan-d3d9-check KisakCOD-world-draw-probe KisakCOD-mp \
            --parallel "$(nproc)"
          for program in KisakCOD-device-probe KisakCOD-vulkan-d3d9-check KisakCOD-world-draw-probe KisakCOD-mp; do
            readelf -h "$OUT_DIR/$program" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
            # The Vulkan loader is opened at run time through SDL, never linked.
            if readelf -d "$OUT_DIR/$program" | grep -q 'libvulkan'; then
              echo "$program must not link the Vulkan loader" >&2
              exit 1
            fi
          done

      - name: Run the device probe through the Vulkan back end on lavapipe
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/stand-ins"
          log="$RUNNER_TEMP/device-probe-vulkan.log"
          "$OUT_DIR/KisakCOD-device-probe" --backend vulkan --validation auto 2>&1 | tee "$log"
          grep -qx 'Graphics back end: Vulkan (validation auto, device -1, shader cache off)' "$log"
          grep -q '^vulkan presents=3 skipped=0 unsupported_calls=0 ' "$log"
          grep -q '^readback width=640 height=480 .* mismatched_pixels=0$' "$log"
          grep -q '^vulkan_teardown destroyed=yes ' "$log"
          tail -n 1 "$log" | grep -qx 'device_probe=passed renderer=shader_model_3 frames=3'
          # The default back end is still the system's D3D9, here the stand-in.
          status=0
          "$OUT_DIR/KisakCOD-device-probe" > "$RUNNER_TEMP/device-probe-d3d9.log" 2>&1 || status=$?
          test "$status" -eq 1
          tail -n 1 "$RUNNER_TEMP/device-probe-d3d9.log" | grep -q '^device_probe=failed stage=direct3d '
          status=0
          "$OUT_DIR/KisakCOD-device-probe" --backend opengl > /dev/null 2>&1 || status=$?
          test "$status" -eq 2

      - name: Run the D3D9 front check on i386 lavapipe
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib"
          python3 -u scripts/tests/test_vulkan_d3d9_front.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-d3d9-check" \
            --video-driver offscreen --validation off

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vulkan-engine-${{ github.run_id }}-${{ github.run_attempt }}
