name: Linux native server and client foundations

# Builds and checks the 32-bit native Linux dedicated server (KISAK_PLATFORM=linux,
# target KisakCOD-dedi), client core, and optional disconnected SDL window host.
# This is not a playable graphical client. Checks need no installed game data,
# Steam client or credentials. Window checks explicitly use SDL dummy video/audio.
# Only isolated test fixtures accept local traffic; no public server is exposed.
# Tool installation and the pinned Tracy dependency require network access.
#
# Configure and build stay in the workflow and never reuse the Windows output
# paths: each configuration gets its own build directory and its own runtime
# output directory. The Python runner only tests what was built.

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - build-linux.sh
      - scripts/**
      - src/**
      - deps/**
      - tests/linux_net/**
      - tests/linux_client_core/**
      - tests/linux_client_commands/**
      - tests/linux_window/**
      - .github/workflows/build-kisakcod-linux.yaml
  pull_request:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - build-linux.sh
      - scripts/**
      - src/**
      - deps/**
      - tests/linux_net/**
      - tests/linux_client_core/**
      - tests/linux_client_commands/**
      - tests/linux_window/**
      - .github/workflows/build-kisakcod-linux.yaml

permissions:
  contents: read

jobs:
  window:
    name: Linux SDL2 window ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install 32-bit SDL2 build tools
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build clang g++-multilib python3 python3-yaml libsdl2-dev:i386
          test -f /usr/lib/i386-linux-gnu/cmake/SDL2/sdl2-config.cmake
      - name: Check graphical workflow contract
        run: python3 scripts/tests/test_linux_window_workflow.py
      - name: Build and test asset-free window host
        timeout-minutes: 45
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -u scripts/tests/test_linux_window.py \
            --build-dir "$GITHUB_WORKSPACE/build-linux/window-${{ matrix.config }}" \
            --build-type "${{ matrix.config }}" --cc clang --cxx clang++ --jobs 2 \
            --sdl2-dir /usr/lib/i386-linux-gnu/cmake/SDL2 --video-driver dummy \
            2>&1 | tee "artifacts/window-${{ matrix.config }}.log"
      - name: Upload window check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-window-${{ matrix.config }}
          path: artifacts/window-${{ matrix.config }}.log
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Native Linux ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo]

    env:
      # Separate from bin/<config> so the Windows targets keep their own outputs.
      BUILD_DIR: build-linux/${{ matrix.config }}
      CMAKE_RUNTIME_OUTPUT_DIRECTORY: ${{ github.workspace }}/out/linux-${{ matrix.config }}
      BINARY: out/linux-${{ matrix.config }}/KisakCOD-dedi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native 32-bit build tools
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build clang g++-multilib python3

      - name: Report compiler versions
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          clang++ --version
          cmake --version
          ninja --version
          python3 --version
          echo "target architecture probe:"
          printf 'int main(){return 0;}\n' > "$RUNNER_TEMP/m32-probe.cpp"
          clang++ -m32 "$RUNNER_TEMP/m32-probe.cpp" -o "$RUNNER_TEMP/m32-probe"
          "$RUNNER_TEMP/m32-probe"
          echo "32-bit link works"

      - name: Configure ${{ matrix.config }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=linux \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"

      - name: Build KisakCOD-dedi
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel 2
          test -x "$BINARY"
          ls -l "$BINARY"

      - name: Check test-runner configuration and failure handling
        shell: bash
        run: |
          python3 scripts/tests/test_linux_check_runner.py
          python3 scripts/tests/test_linux_fastfile_driver.py
          python3 scripts/tests/test_linux_client_core_driver.py

      - name: Run asset-free native checks
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/run_linux_checks.py \
            --build-dir "$BUILD_DIR" \
            --binary "$BINARY" \
            --cxx clang++ \
            --log-dir "artifacts/checks-${{ matrix.config }}"

      - name: Build and check native client core
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_linux_client_core.py \
            --cxx clang++ \
            --build-type "${{ matrix.config }}" \
            --build-dir "$GITHUB_WORKSPACE/build-linux/client-core-${{ matrix.config }}"

      - name: Upload executable and check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-linux-${{ matrix.config }}
          # The executable plus text logs only: no bin/ tree, no game data.
          path: |
            ${{ env.BINARY }}
            artifacts/checks-${{ matrix.config }}
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7
