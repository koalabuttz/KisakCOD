name: Server file references

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - src/qcommon/files.cpp
      - scripts/tests/test_server_referenced_files.py
      - .github/workflows/server-file-references.yaml
  push:
    branches: [master]
    paths:
      - src/qcommon/files.cpp
      - scripts/tests/test_server_referenced_files.py
      - .github/workflows/server-file-references.yaml

# Read-only token: these jobs only check out, build and upload artifacts.
permissions:
  contents: read

jobs:
  bounds:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/test_server_referenced_files.py
