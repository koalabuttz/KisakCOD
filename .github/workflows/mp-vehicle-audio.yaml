name: Multiplayer vehicle audio

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - src/game_mp/g_vehicles_mp.cpp
      - src/game_mp/g_utils_mp.cpp
      - src/game_mp/g_utils_mp.h
      - src/cgame_mp/cg_vehicles_mp.cpp
      - scripts/tests/test_mp_vehicle_audio.py
      - .github/workflows/mp-vehicle-audio.yaml
  push:
    branches: [master]
    paths:
      - src/game_mp/g_vehicles_mp.cpp
      - src/game_mp/g_utils_mp.cpp
      - src/game_mp/g_utils_mp.h
      - src/cgame_mp/cg_vehicles_mp.cpp
      - scripts/tests/test_mp_vehicle_audio.py
      - .github/workflows/mp-vehicle-audio.yaml

# Read-only token: these jobs only check out, build and upload artifacts.
permissions:
  contents: read

jobs:
  audio:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/test_mp_vehicle_audio.py
