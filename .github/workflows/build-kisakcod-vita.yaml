name: PS Vita server and client

# Builds the opt-in PS Vita port (docs/vita.md, docs/vita-client.md): the
# dedicated server and the multiplayer client, each Debug and RelWithDebInfo,
# with Clang against the pinned VitaSDK, packed as .vpk files. Nothing runs
# here but the port's host tests: there is no Vita on a runner, so start-up
# and map loading are checked in Vita3K and on David's console.
#
# These jobs were part of build-kisakcod-linux.yaml. They have their own
# workflow so that a change to the port's own files (src/vita, src/gfx_gxm,
# its CMake files and tests) starts these four jobs and not the thirty Linux
# ones, which neither compile nor read those files. A change to shared source
# starts both workflows, as before. The artifacts keep their names
# (KisakCOD-dedi-vita-<config>, KisakCOD-mp-vita-<config>); only the workflow
# they hang on changed.

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - scripts/**
      # The test machines' run scripts and their tests: run-scripts.yaml.
      - '!scripts/runs/**'
      - '!scripts/tests/test_perf_run.py'
      - '!scripts/tests/test_pc_run.py'
      - '!scripts/tests/test_vita3k_runner.py'
      - src/**
      - deps/**
      - tests/vita_*/**
      - .github/workflows/build-kisakcod-vita.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - scripts/**
      # The test machines' run scripts and their tests: run-scripts.yaml.
      - '!scripts/runs/**'
      - '!scripts/tests/test_perf_run.py'
      - '!scripts/tests/test_pc_run.py'
      - '!scripts/tests/test_vita3k_runner.py'
      - src/**
      - deps/**
      - tests/vita_*/**
      - .github/workflows/build-kisakcod-vita.yaml

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run. Every
# master run and every manual run has a group of its own and always finishes:
# console runs install master's vpk, so each merge that changes the port has
# to keep one, and these four jobs are small.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vita_dedicated:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Opt-in PS Vita track (docs/vita.md): build KisakCOD-dedi with Clang
    # against the pinned VitaSDK (scripts/ci/install-vitasdk.sh), pack the
    # .vpk, and check that the server keeps x86's float results (no fused
    # multiply-add, no NEON float math). Nothing runs: there is no Vita here,
    # so start-up and map loading are checked on David's console.
    # Debug and RelWithDebInfo run one after the other in this one job:
    # each step that depends on the configuration runs it for both
    # (scripts/ci/each-config.sh), so the pair needs one runner, not two.
    name: PS Vita dedicated server
    runs-on: ubuntu-24.04
    timeout-minutes: 62


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/apt-install.sh cmake ninja-build clang python3 ccache

      - name: Restore VitaSDK
        id: vitasdk_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vitasdk
          key: vitasdk-${{ hashFiles('scripts/ci/install-vitasdk.sh') }}

      - name: Install VitaSDK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "VITASDK=$(scripts/ci/install-vitasdk.sh "$RUNNER_TEMP/vitasdk")" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-dedicated-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vita-dedicated-
      - name: Use compiler cache
        id: ccache
        shell: bash
        env:
          # One cache holds both configurations.
          KISAK_CCACHE_MAXSIZE: 1G
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Configure PS Vita
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          export BUILD_DIR="build-vita/$config"
          export CMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/out/vita-$config"
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=vita \
            -DCMAKE_BUILD_TYPE=$config \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY"
          COMMANDS

      - name: Build PS Vita KisakCOD-dedi and its .vpk
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          export BUILD_DIR="build-vita/$config"
          export BINARY="out/vita-$config/KisakCOD-dedi"
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi-vpk --parallel "$(nproc)"
          ls -l "$BINARY" "$BINARY.vpk"
          # Float results have to match x86 (docs/vita.md): no fused
          # multiply-adds, and no NEON float math on Q or D registers (NEON
          # flushes denormals to zero); scalar VFP uses S registers for floats.
          "$VITASDK/bin/arm-vita-eabi-objdump" -d "$BINARY" > "$RUNNER_TEMP/vita-dedi.dis"
          if grep -Eq $'\t(vfma|vfms|vfnma|vfnms)' "$RUNNER_TEMP/vita-dedi.dis"; then
            echo "the server contains fused multiply-add instructions" >&2
            exit 1
          fi
          if grep -Eq $'\tv[a-z0-9]+\.f(32|64)\tq|\tv[a-z0-9]+\.f32\td' "$RUNNER_TEMP/vita-dedi.dis"; then
            echo "the server contains NEON float instructions" >&2
            exit 1
          fi
          # Symbols the link must keep (scripts/platform/vita/CMakeLists.txt):
          # libgcc's weak pthread references (an unresolved one switches its
          # thread support off, and every thread_local becomes shared), and
          # sceUserMainThreadStackSize, which sets the main thread's stack.
          "$VITASDK/bin/arm-vita-eabi-nm" "$BINARY" > "$RUNNER_TEMP/vita-dedi.sym"
          if grep -Eq '^ +w pthread_' "$RUNNER_TEMP/vita-dedi.sym"; then
            grep -E '^ +w pthread_' "$RUNNER_TEMP/vita-dedi.sym" >&2
            echo "the server leaves weak pthread references unresolved" >&2
            exit 1
          fi
          for symbol in pthread_cancel pthread_once sceUserMainThreadStackSize; do
            if ! grep -Eq " [TD] $symbol\$" "$RUNNER_TEMP/vita-dedi.sym"; then
              echo "the server does not link $symbol" >&2
              exit 1
            fi
          done
          COMMANDS

      # RelWithDebInfo is the build the machines install; the artifact keeps its name.
      - name: Upload the .vpk
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-dedi-vita-RelWithDebInfo
          path: out/vita-RelWithDebInfo/KisakCOD-dedi.vpk
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-dedicated-${{ github.run_id }}-${{ github.run_attempt }}

  vita_mp_client:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Opt-in PS Vita client, stage 1 (docs/vita-client.md): build KisakCOD-mp
    # with Clang against the pinned VitaSDK and pack its .vpk. The D3D9
    # declarations come from DXVK Native's headers (nothing of DXVK is built)
    # and the OpenAL ones from libopenal-dev; the client links no D3D9 or OpenAL
    # library. The same float and link checks as the Vita server. The client
    # does not run here: start-up is checked on David's Vita. Its control
    # mapping and its small OpenAL do, as host tests.
    # Debug and RelWithDebInfo run one after the other in this one job:
    # each step that depends on the configuration runs it for both
    # (scripts/ci/each-config.sh), so the pair needs one runner, not two.
    name: PS Vita multiplayer client
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore downloaded apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-${{ github.job }}-${{ runner.arch }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ github.job }}-${{ runner.arch }}-v1

      - name: Install build tools
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # libopenal-dev only for its headers, copied below on their own.
          scripts/ci/apt-install.sh cmake ninja-build clang python3 ccache libopenal-dev glslang-tools
          mkdir -p "$RUNNER_TEMP/al-include"
          cp -r /usr/include/AL "$RUNNER_TEMP/al-include/"

      - name: Restore VitaSDK
        id: vitasdk_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vitasdk
          key: vitasdk-${{ hashFiles('scripts/ci/install-vitasdk.sh') }}

      - name: Install VitaSDK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          echo "VITASDK=$(scripts/ci/install-vitasdk.sh "$RUNNER_TEMP/vitasdk")" >> "$GITHUB_ENV"

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as the Linux client jobs. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-mp-client-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-vita-mp-client-
      - name: Use compiler cache
        id: ccache
        shell: bash
        env:
          # One cache holds both configurations.
          KISAK_CCACHE_MAXSIZE: 1G
        run: |
          set -euo pipefail
          scripts/ci/use-ccache.sh

      - name: Check the client's controls, sound and program queue on the host
        # The control mapping, the small OpenAL, the queue that makes shader
        # programs on a worker thread and the plan of a run nobody watches
        # make no Vita call: the host compiler builds them with sanitizers
        # and runs their checks.
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_vita_run_plan.py
          python3 scripts/tests/test_vita_run_list.py
          python3 scripts/tests/test_vita_input.py
          python3 scripts/tests/test_vita_sound.py --al-include "$RUNNER_TEMP/al-include"
          python3 scripts/tests/test_vita_program_queue.py
          python3 scripts/tests/test_vita_gxm_heap.py
          python3 scripts/tests/test_vita_frame_time.py
          python3 scripts/tests/test_vita_gpu_progress.py
          python3 scripts/tests/test_vita_cg_translate.py --require-glslang
          # The static model cache's size arithmetic, at every size: the
          # Vita build runs a smaller cache than the retail game.
          python3 scripts/tests/test_static_model_cache_sizes.py
          # The tree-wide source rule of the native Linux job, for a change
          # that touches only this port and so does not start that job.
          python3 scripts/tools/strip_cdecl.py --check

      - name: Configure PS Vita client
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          export BUILD_DIR="build-vita-mp/$config"
          export CMAKE_RUNTIME_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/out/vita-mp-$config"
          clang++ --version
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=vita \
            -DCMAKE_BUILD_TYPE=$config \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$CMAKE_RUNTIME_OUTPUT_DIRECTORY" \
            -DKISAK_BUILD_VITA_MP_CLIENT=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_OPENAL_INCLUDE_DIR="$RUNNER_TEMP/al-include"
          COMMANDS

      - name: Build PS Vita KisakCOD-mp and its .vpk
        timeout-minutes: 80
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          export BUILD_DIR="build-vita-mp/$config"
          export BINARY="out/vita-mp-$config/KisakCOD-mp"
          cmake --build "$BUILD_DIR" --target KisakCOD-mp-vpk KisakCOD-gxm-probe-vpk --parallel "$(nproc)"
          ls -l "$BINARY" "$BINARY.vpk" "$(dirname "$BINARY")/KisakCOD-gxm-probe.vpk"
          "$VITASDK/bin/arm-vita-eabi-size" -A "$BINARY" | grep -E '^\.(text|rodata|data|bss) '
          # Float results have to match x86 (docs/vita.md): client prediction
          # replays the server's movement math.
          "$VITASDK/bin/arm-vita-eabi-objdump" -d "$BINARY" > "$RUNNER_TEMP/vita-mp.dis"
          if grep -Eq $'\t(vfma|vfms|vfnma|vfnms)' "$RUNNER_TEMP/vita-mp.dis"; then
            echo "the client contains fused multiply-add instructions" >&2
            exit 1
          fi
          if grep -Eq $'\tv[a-z0-9]+\.f(32|64)\tq|\tv[a-z0-9]+\.f32\td' "$RUNNER_TEMP/vita-mp.dis"; then
            echo "the client contains NEON float instructions" >&2
            exit 1
          fi
          "$VITASDK/bin/arm-vita-eabi-nm" "$BINARY" > "$RUNNER_TEMP/vita-mp.sym"
          if grep -Eq '^ +w pthread_' "$RUNNER_TEMP/vita-mp.sym"; then
            grep -E '^ +w pthread_' "$RUNNER_TEMP/vita-mp.sym" >&2
            echo "the client leaves weak pthread references unresolved" >&2
            exit 1
          fi
          for symbol in pthread_cancel pthread_once sceUserMainThreadStackSize; do
            if ! grep -Eq " [TD] $symbol\$" "$RUNNER_TEMP/vita-mp.sym"; then
              echo "the client does not link $symbol" >&2
              exit 1
            fi
          done
          # The ELF with its symbols goes beside the .vpk it was packed from,
          # so a crash dump's addresses can be named with arm-vita-eabi-addr2line
          # on whatever machine fetched the artifact.
          cp "$BINARY" "$BINARY.elf"
          sha256sum "$BINARY.vpk" "$BINARY.elf"
          COMMANDS

      # RelWithDebInfo is the build the machines install; the artifact keeps its name.
      - name: Upload the .vpk and its ELF
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-mp-vita-RelWithDebInfo
          path: |
            out/vita-mp-RelWithDebInfo/KisakCOD-mp.vpk
            out/vita-mp-RelWithDebInfo/KisakCOD-mp.elf
            ${{ github.workspace }}/out/vita-mp-RelWithDebInfo/KisakCOD-gxm-probe.vpk
          if-no-files-found: error
          retention-days: 14

      - name: Report compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-vita-mp-client-${{ github.run_id }}-${{ github.run_attempt }}
