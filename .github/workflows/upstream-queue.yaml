name: Upstream patch queue

# docs/upstream holds changes prepared for the upstream repository, one patch
# per future pull request, each made on upstream's own tree. This workflow
# proves the queue there: it fetches the pinned upstream commit (a read of a
# public repository; nothing is sent to it), checks that every patch applies,
# and builds the patched tree with the steps upstream's own workflow runs on a
# pull request (MSVC, DirectX SDK, Debug and Release; sp, mp and dedi).
#
# The build is of all patches together. Each patch is also checked to apply to
# the base alone, because each is meant to be its own pull request; the few
# that docs/upstream/DEPENDS lists are checked on top of the patches they name.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths:
      - docs/upstream/**
      - scripts/tools/upstream_queue.py
      - scripts/tests/test_upstream_queue.py
      - .github/workflows/upstream-queue.yaml
  push:
    branches: [ "master" ]
    paths:
      - docs/upstream/**
      - scripts/tools/upstream_queue.py
      - scripts/tests/test_upstream_queue.py
      - .github/workflows/upstream-queue.yaml

# A newer push to the same pull request or branch replaces the run in progress.
# Manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out and build.
permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/SwagSoftware/KisakCOD.git

jobs:
  check:
    name: Patches apply to upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the queue tool
        run: python3 scripts/tests/test_upstream_queue.py

      - name: Fetch upstream at the pinned base
        run: |
          set -euo pipefail
          base="$(cat docs/upstream/BASE)"
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch -q --depth 1 "$UPSTREAM_URL" "$base"
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "$base"

      - name: Check the queue
        run: python3 scripts/tools/upstream_queue.py check --upstream "$RUNNER_TEMP/upstream"

  build:
    name: MSVC build of patched upstream
    needs: check
    runs-on: windows-2022
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DXSDK_PKG: Microsoft.DXSDK.D3DX
      DXSDK_VER: 9.29.952.8

    steps:
      # Keep both trees byte-for-byte as committed, so the patches apply on
      # Windows exactly as they do in the check job.
      - name: Turn off line ending conversion
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout the queue
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Fetch upstream at the pinned base
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat fork/docs/upstream/BASE)"
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$UPSTREAM_URL" "$base"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$base"

      - name: Apply the queue
        shell: bash
        run: python fork/scripts/tools/upstream_queue.py apply --upstream upstream

      # From here on, the steps of upstream's build-kisarcod-win.yaml at the
      # pinned base, run inside the patched tree.
      - name: Install .NET SDK (for nuget usage)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore DXSDK NuGet package
        run: |
          dotnet new classlib -o dxsdk-temp
          cd dxsdk-temp
          dotnet add package $env:DXSDK_PKG --version $env:DXSDK_VER
          cd ..

      - name: Extract DXSDK paths from NuGet
        shell: powershell
        run: |
          $pkgPath = Join-Path "${env:NUGET_PACKAGES}" "$env:DXSDK_PKG\$env:DXSDK_VER"
          $sdkDir = Join-Path $pkgPath "build\native"
          echo "DXSDK_DIR=$sdkDir" >> $env:GITHUB_ENV
          Write-Host $sdkDir

      - name: Install latest CMake
        uses: lukka/get-cmake@30aea713799f46b5b60e60f5fa83f849abd52c22 # the "latest" branch on 2026-11-05

      - name: Configure CMake ${{ matrix.config }}
        working-directory: upstream
        run: |
          mkdir build-${{ matrix.config }}
          cd build-${{ matrix.config }}
          cmake -G "Visual Studio 17 2022" -A Win32 -DDXSDK_DIR="${{ env.DXSDK_DIR }}" -DCICD=1 -DCMAKE_BUILD_TYPE=${{ matrix.config }} ..

      - name: Build ${{ matrix.config }}
        working-directory: upstream
        run: |
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-sp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-mp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --target "KisakCOD-dedi"
