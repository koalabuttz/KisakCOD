name: macOS

# Opt-in macOS track, step one (docs/macos.md): build the dedicated server
# KisakCOD-dedi with -DKISAK_PLATFORM=macos for Apple silicon (arm64) and Intel
# Macs (x86_64), each on a hosted runner of its own architecture, and run the
# asset-free bootstrap test against the Mach-O binary and the platform
# self-tests built for the Mac (run_linux_checks.py --arch). No game data,
# Steam or GPU is involved, so loading a real map is not covered here. The
# Linux and Windows builds are untouched.
#
# Step two builds the multiplayer client KisakCOD-mp the same way against the
# pinned SDL3 and the D3D9 and OpenAL stand-ins (no MoltenVK or DXVK library
# yet), and runs the client's asset-free checks. Nothing draws a frame.
#
# Step three builds the Vulkan window probe (the shared core of the planned
# Vulkan back end, docs/vulkan-core.md) against MoltenVK and runs it in a real
# window on each runner.
#
# A manual run with universal=true also builds the client RelWithDebInfo for
# each architecture, packs each as an app bundle, merges the two into one
# universal (arm64 + x86_64) KisakCOD-mp.app and reports its size.

on:
  workflow_dispatch:
    inputs:
      universal:
        description: Also build an optimised universal app bundle and report its size
        type: boolean
        default: false
  push:
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - scripts/common_files.cmake
      - scripts/mp/**
      - scripts/extern/**
      - scripts/platform/linux/**
      - scripts/tests/test_linux_bootstrap.py
      - scripts/tests/run_linux_checks.py
      - scripts/tests/test_linux_runtime.py
      - scripts/tests/test_linux_net_deadline.py
      - scripts/tests/test_linux_perf_ab.py
      - tests/linux_perf/**
      - tests/linux_net/**
      - scripts/tests/test_linux_mp_client.py
      - scripts/tests/run_native_d3d9_boundary_checks.py
      - tests/linux_mp_client/**
      - tests/linux_device_probe/d3d9_unavailable.cpp
      - tests/skinning/**
      - tests/linux_cinematic/**
      - scripts/platform/macos/**
      - scripts/vulkan_probe/**
      - scripts/tests/test_vulkan_*.py
      - scripts/tools/vulkan/**
      - src/**
      # The PS Vita port's own sources reach no Mac build: shared sources
      # include its headers only in Vita builds. Later patterns override
      # earlier ones. scripts/tests/test_linux_window_workflow.py checks it.
      - '!src/vita/**'
      - '!src/gfx_gxm/**'
      - deps/**
      - .github/workflows/build-kisakcod-macos.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "master" ]
    paths:
      - CMakeLists.txt
      - scripts/common_files.cmake
      - scripts/mp/**
      - scripts/extern/**
      - scripts/platform/linux/**
      - scripts/tests/test_linux_bootstrap.py
      - scripts/tests/run_linux_checks.py
      - scripts/tests/test_linux_runtime.py
      - scripts/tests/test_linux_net_deadline.py
      - scripts/tests/test_linux_perf_ab.py
      - tests/linux_perf/**
      - tests/linux_net/**
      - scripts/tests/test_linux_mp_client.py
      - scripts/tests/run_native_d3d9_boundary_checks.py
      - tests/linux_mp_client/**
      - tests/linux_device_probe/d3d9_unavailable.cpp
      - tests/skinning/**
      - tests/linux_cinematic/**
      - scripts/platform/macos/**
      - scripts/vulkan_probe/**
      - scripts/tests/test_vulkan_*.py
      - scripts/tools/vulkan/**
      - src/**
      # The PS Vita port's own sources reach no Mac build: shared sources
      # include its headers only in Vita builds. Later patterns override
      # earlier ones. scripts/tests/test_linux_window_workflow.py checks it.
      - '!src/vita/**'
      - '!src/gfx_gxm/**'
      - deps/**
      - .github/workflows/build-kisakcod-macos.yaml

permissions:
  contents: read

# Same rule as the Linux and Windows workflows: a newer push to a pull request
# cancels its older run; a master run in progress finishes and only the newest
# later merge waits; manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dedicated:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: macOS ${{ matrix.arch }} dedicated server
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on pull requests; Intel Macs join after a merge and on
        # manual runs (docs/ci.md). GitHub runs five macOS jobs at a time, so
        # Debug and RelWithDebInfo share one runner (scripts/ci/each-config.sh).
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64"]' || '["arm64", "x86_64"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          command -v ninja >/dev/null || brew install ninja
          sw_vers
          xcrun clang++ --version
          cmake --version | head -n 1

      - name: Configure ${{ matrix.arch }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          cmake -S . -B "build-macos/${{ matrix.arch }}-$config" -G Ninja \
            -DKISAK_PLATFORM=macos \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE="$config" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/out/macos-${{ matrix.arch }}-$config"
          COMMANDS

      - name: Build KisakCOD-dedi
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          BUILD_DIR="build-macos/${{ matrix.arch }}-$config"
          BINARY="out/macos-${{ matrix.arch }}-$config/KisakCOD-dedi"
          # -k 0: report every unit that fails, not only the first. On a
          # failure, end with each distinct error once so the cause is not
          # buried under the warnings of the units that built.
          status=0
          cmake --build "$BUILD_DIR" --target KisakCOD-dedi --parallel "$(sysctl -n hw.ncpu)" -- -k 0 \
            2>&1 | tee "$RUNNER_TEMP/build-$config.log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Distinct errors"
            grep -E "error:|Undefined symbols|referenced from|ld: " "$RUNNER_TEMP/build-$config.log" | sed 's#^.*/KisakCOD/KisakCOD/##' | sort | uniq -c | sort -rn | head -n 300
            echo "::endgroup::"
            exit "$status"
          fi
          ls -l "$BINARY"
          file "$BINARY"
          COMMANDS

      - name: Check for fused multiply-adds
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          # Apple silicon only.
          if [ "${{ matrix.arch }}" != arm64 ]; then exit 0; fi
          BINARY="out/macos-${{ matrix.arch }}-$config/KisakCOD-dedi"
          # Apple silicon must not fuse multiply-adds (-ffp-contract=off):
          # float results have to match x86 (docs/macos.md).
          if xcrun objdump -d --no-show-raw-insn "$BINARY" | grep -Eq $'\t(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\\b'; then
            echo "the server contains fused multiply-add instructions" >&2
            exit 1
          fi
          COMMANDS

      # The bootstrap test, then the platform self-tests built for this Mac:
      # the POSIX primitives and engine wrappers (timed waits on macOS's
      # relative condition-variable wait), network deadlines, UDP through
      # recvmsg (oversize datagrams included), file I/O, and the virtual
      # memory layer (decommit by remapping; 16 KiB pages on Apple silicon).
      - name: Asset-free checks
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/each-config.sh <<'COMMANDS'
          python3 scripts/tests/run_linux_checks.py --arch macos-${{ matrix.arch }} \
            --build-dir "build-macos/${{ matrix.arch }}-$config" \
            --binary "out/macos-${{ matrix.arch }}-$config/KisakCOD-dedi" --cxx clang++ \
            --log-dir "$RUNNER_TEMP/checks/$config"
          COMMANDS

      - name: Upload check logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: checks-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/checks
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-dedi-macos-${{ matrix.arch }}
          path: out/macos-${{ matrix.arch }}-RelWithDebInfo/KisakCOD-dedi
          retention-days: 14
          if-no-files-found: error

  client:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Step two (docs/macos.md): the multiplayer client KisakCOD-mp, built with
    # -DKISAK_PLATFORM=macos against the pinned SDL3 (built here from source)
    # and the CI stand-ins for D3D9 and OpenAL, as the aarch64 Linux client
    # job does, with the Bink movie shim (KISAK_LINUX_CINEMATICS) over a
    # minimal FFmpeg built here from a pinned tag. Then the asset-free checks:
    # the game window test, the client's fail-closed start from temporary
    # trees with no game data, the Bink shim test and the skinning tests. No
    # MoltenVK, DXVK library, GPU, game data or game movie is involved.
    name: macOS ${{ matrix.arch }} multiplayer client${{ matrix.config != 'Debug' && format(' {0}', matrix.config) || '' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on pull requests; Intel Macs join after a merge and on
        # manual runs (docs/ci.md). GitHub runs five macOS jobs at a time.
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64"]' || '["arm64", "x86_64"]') }}
        # Debug on every run; a manual universal=true run adds an optimised
        # build whose app bundle the universal job merges.
        config: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.universal && '["Debug", "RelWithDebInfo"]' || '["Debug"]') }}

    env:
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      # FFmpeg n7.1.5 (LGPL), for the Bink shim's libavcodec and libavutil.
      FFMPEG_REVISION: 3a0867c2bfda4a4d4309ca1a8cbdc6175e67f587
      BUILD_DIR: build-macos/${{ matrix.arch }}-mp-client-${{ matrix.config }}
      OUT_DIR: ${{ github.workspace }}/out/macos-${{ matrix.arch }}-mp-client-${{ matrix.config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          command -v ninja >/dev/null || brew install ninja
          # CMake finds the FFmpeg build below through pkg-config.
          command -v pkg-config >/dev/null || brew install pkgconf
          # openal-soft only for <AL/al.h>; the client links the OpenAL stand-in.
          brew list openal-soft >/dev/null 2>&1 || brew install openal-soft
          test -f "$(brew --prefix openal-soft)/include/AL/al.h"
          # Headers only, for the Vulkan back end linked into the client; the
          # loader is opened at run time and is not needed to build.
          brew list vulkan-headers >/dev/null 2>&1 || brew install vulkan-headers
          test -f "$(brew --prefix vulkan-headers)/include/vulkan/vulkan.h"
          sw_vers
          xcrun clang++ --version
          cmake --version | head -n 1

      - name: Restore pinned SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-macos-${{ matrix.arch }}-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-macos.yaml') }}

      - name: Build pinned SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same SDL3 commit the Linux client jobs pin.
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.0.dylib" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(sysctl -n hw.ncpu)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          ls -l "$RUNNER_TEMP/SDL3-sdk/lib"
          lipo -archs "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.0.dylib" | grep -qx "${{ matrix.arch }}"

      - name: Build a minimal pinned FFmpeg
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # Only what the Bink shim needs (docs/linux-cinematics.md): libavcodec
          # with the Bink video and audio decoders, and libavutil. Shared
          # libraries named @rpath/..., like the stand-ins. --disable-x86asm
          # spares the runner nasm; the decoders keep their C code.
          src="$RUNNER_TEMP/ffmpeg-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C "$src" fetch --depth 1 origin "$FFMPEG_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$FFMPEG_REVISION"
          grep -qx '7.1.5' "$src/RELEASE"
          mkdir -p "$RUNNER_TEMP/ffmpeg-build"
          cd "$RUNNER_TEMP/ffmpeg-build"
          # /usr/bin/clang, not the toolchain's own clang: the shim finds the
          # SDK, which the bare toolchain binary cannot link without.
          "$src/configure" --prefix="$RUNNER_TEMP/ffmpeg-sdk" --install-name-dir='@rpath' \
            --cc=/usr/bin/clang \
            --extra-cflags=-mmacosx-version-min=13.3 --extra-ldflags=-mmacosx-version-min=13.3 \
            --enable-shared --disable-static --disable-programs --disable-doc \
            --disable-everything --disable-autodetect --disable-network \
            --disable-avformat --disable-avdevice --disable-avfilter --disable-swscale --disable-swresample \
            --disable-x86asm --enable-decoder=bink,binkaudio_rdft,binkaudio_dct \
            || { tail -n 80 ffbuild/config.log; exit 1; }
          make -j"$(sysctl -n hw.ncpu)"
          make install
          ls -l "$RUNNER_TEMP/ffmpeg-sdk/lib"
          for library in libavcodec.61.dylib libavutil.59.dylib; do
            lipo -archs "$RUNNER_TEMP/ffmpeg-sdk/lib/$library" | grep -qx "${{ matrix.arch }}"
            otool -D "$RUNNER_TEMP/ffmpeg-sdk/lib/$library" | tail -n 1 | grep -qx "@rpath/$library"
          done

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The same source-only fetch as the Linux client jobs: the headers the
          # renderer boundary compiles against. Nothing is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the multiplayer client against the stand-ins
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stand-ins"
          d3d9="$RUNNER_TEMP/stand-ins/libd3d9_unavailable.dylib"
          openal="$RUNNER_TEMP/stand-ins/libopenal_unavailable.dylib"
          xcrun clang++ -dynamiclib -arch ${{ matrix.arch }} -mmacosx-version-min=13.3 \
            -Wall -Wextra -Werror -install_name @rpath/libd3d9_unavailable.dylib \
            tests/linux_device_probe/d3d9_unavailable.cpp -o "$d3d9"
          xcrun clang++ -dynamiclib -arch ${{ matrix.arch }} -mmacosx-version-min=13.3 \
            -Wall -Wextra -Werror -install_name @rpath/libopenal_unavailable.dylib \
            tests/linux_mp_client/openal_unavailable.cpp -o "$openal"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/ffmpeg-sdk/lib/pkgconfig"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=macos \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_DXVK_NATIVE_LIBRARY="$d3d9" \
            -DKISAK_BUILD_LINUX_MP_CLIENT=ON -DKISAK_OPENAL_LIBRARY="$openal" \
            -DKISAK_OPENAL_INCLUDE_DIR="$(brew --prefix openal-soft)/include" \
            -DKISAK_LINUX_CINEMATICS=ON \
            -DKISAK_BUILD_VULKAN_PROBE=ON -DKISAK_BUILD_VULKAN_SHADERS=ON \
            -DKISAK_BUILD_VULKAN_LEGACY=ON -DKISAK_BUILD_VULKAN_BACKEND=ON \
            -DKISAK_VULKAN_INCLUDE_DIR="$(brew --prefix vulkan-headers)/include" \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tee "$RUNNER_TEMP/configure.log"
          # r_backend vulkan (docs/vulkan-d3d9-front.md): the client carries the
          # Vulkan back end next to the D3D9 one; d3d9 stays the default.
          grep -qx -- '-- Vulkan back end: linked into KisakCOD-mp' "$RUNNER_TEMP/configure.log"
          targets=(KisakCOD-mp KisakCOD-mp-client-window-test KisakCOD-native-d3d9-proofs KisakCOD-bink-shim-test
            KisakCOD-skin-scalar-test)
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            targets+=(KisakCOD-skin-sse2-test)
          fi
          # -k 0: report every unit that fails, then each distinct error once.
          status=0
          cmake --build "$BUILD_DIR" --target "${targets[@]}" --parallel "$(sysctl -n hw.ncpu)" -- -k 0 \
            2>&1 | tee "$RUNNER_TEMP/build.log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Distinct errors"
            grep -E "error:|Undefined symbols|referenced from|ld: " "$RUNNER_TEMP/build.log" | sed 's#^.*/KisakCOD/KisakCOD/##' | sort | uniq -c | sort -rn | head -n 300
            echo "::endgroup::"
            exit "$status"
          fi
          for binary in "$OUT_DIR/KisakCOD-mp" "$OUT_DIR/KisakCOD-mp-client-window-test"; do
            file "$binary"
            lipo -archs "$binary" | grep -qx "${{ matrix.arch }}"
          done
          otool -L "$OUT_DIR/KisakCOD-mp" | tail -n +2 | awk '{print $1}' > "$RUNNER_TEMP/mp-client-needed.txt"
          cat "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx '@rpath/libSDL3.0.dylib' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx '@rpath/libd3d9_unavailable.dylib' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx '@rpath/libopenal_unavailable.dylib' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx '@rpath/libavcodec.61.dylib' "$RUNNER_TEMP/mp-client-needed.txt"
          grep -qx '@rpath/libavutil.59.dylib' "$RUNNER_TEMP/mp-client-needed.txt"
          if grep -Ev '^(@rpath/libSDL3\.0\.dylib|@rpath/libd3d9_unavailable\.dylib|@rpath/libopenal_unavailable\.dylib|@rpath/libavcodec\.61\.dylib|@rpath/libavutil\.59\.dylib|/usr/lib/libc\+\+\.1\.dylib|/usr/lib/libSystem\.B\.dylib)$' \
              "$RUNNER_TEMP/mp-client-needed.txt"; then
            echo "the multiplayer client needs a library beyond SDL3, D3D9, OpenAL, FFmpeg and the system runtimes" >&2
            exit 1
          fi
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            # Apple silicon must not fuse multiply-adds (-ffp-contract=off):
            # float results have to match x86 (docs/macos.md).
            if xcrun objdump -d --no-show-raw-insn "$OUT_DIR/KisakCOD-mp" | grep -Eq $'\t(fmadd|fmsub|fnmadd|fnmsub|fmla|fmls)\\b'; then
              echo "the client contains fused multiply-add instructions" >&2
              exit 1
            fi
          fi

      - name: Run the multiplayer client's fail-closed start
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/SDL3-sdk/lib:$RUNNER_TEMP/stand-ins:$RUNNER_TEMP/ffmpeg-sdk/lib"
          "$OUT_DIR/KisakCOD-mp-client-window-test"
          python3 -u scripts/tests/test_linux_mp_client.py --binary "$OUT_DIR/KisakCOD-mp" --native-os macOS

      # The Bink shim on made-up movies and a stand-in decoder, plus
      # libavcodec's Bink decoders opened as the shim opens them. No game
      # movie is read (docs/linux-cinematics.md).
      - name: Run the Bink shim's asset-free test
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/stand-ins:$RUNNER_TEMP/ffmpeg-sdk/lib" "$OUT_DIR/KisakCOD-bink-shim-test"

      # The client packed as KisakCOD-mp.app with its libraries inside
      # (docs/macos.md#app-bundle), signed ad hoc, then started from the bundle
      # with no library path set: it must find everything through its own run
      # path and pass the same fail-closed checks.
      - name: Pack and run the app bundle
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          python3 scripts/platform/macos/make_app_bundle.py \
            --executable "$OUT_DIR/KisakCOD-mp" --output "$RUNNER_TEMP/bundle" \
            --library "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.0.dylib" \
            --library "$RUNNER_TEMP/stand-ins/libd3d9_unavailable.dylib" \
            --library "$RUNNER_TEMP/stand-ins/libopenal_unavailable.dylib" \
            --library "$RUNNER_TEMP/ffmpeg-sdk/lib/libavcodec.61.dylib" \
            --library "$RUNNER_TEMP/ffmpeg-sdk/lib/libavutil.59.dylib"
          app="$RUNNER_TEMP/bundle/KisakCOD-mp.app"
          find "$app" -print
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict --deep --verbose=2 "$app"
          # One run path, the bundle's own; no build-tree folder survives.
          otool -l "$app/Contents/MacOS/KisakCOD-mp" | awk '$1 == "path" {print $2}' > "$RUNNER_TEMP/rpaths.txt"
          cat "$RUNNER_TEMP/rpaths.txt"
          test "$(cat "$RUNNER_TEMP/rpaths.txt")" = "@executable_path/../Frameworks"
          python3 -u scripts/tests/test_linux_mp_client.py --binary "$app/Contents/MacOS/KisakCOD-mp" --native-os macOS

      # tar keeps the bundle's execute bits, which an artifact zip drops.
      - name: Keep the optimised app bundle for the universal job
        if: ${{ matrix.config != 'Debug' }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/bundle" -cf "$RUNNER_TEMP/KisakCOD-mp-app-${{ matrix.arch }}.tar" KisakCOD-mp.app

      - name: Upload the optimised app bundle
        if: ${{ matrix.config != 'Debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: KisakCOD-mp-app-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/KisakCOD-mp-app-${{ matrix.arch }}.tar
          retention-days: 7
          if-no-files-found: error

      # Apple silicon skins with the engine's scalar code; its output must be
      # the bytes every architecture produces (tests/skinning/skin_scalar_test.cpp).
      - name: Run the skinning checks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          "$OUT_DIR/KisakCOD-skin-scalar-test"
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            "$OUT_DIR/KisakCOD-skin-sse2-test"
          fi

  universal:
    # Manual runs with universal=true only: the two optimised client bundles
    # merged into one KisakCOD-mp.app whose executable and libraries each hold
    # an arm64 and an x86_64 slice (lipo), signed ad hoc again, started from
    # the bundle like the per-architecture ones, and measured. The libraries
    # are the CI ones (SDL3, the minimal FFmpeg and the D3D9 and OpenAL
    # stand-ins), so the size is the game code's plus those; no game data.
    name: macOS universal app bundle size
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.universal }}
    needs: client
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the optimised app bundles
        uses: actions/download-artifact@v4
        with:
          pattern: KisakCOD-mp-app-macos-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true

      - name: Merge, sign and run the universal bundle
        timeout-minutes: 10
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          slices="$RUNNER_TEMP/slices"
          for arch in arm64 x86_64; do
            mkdir -p "$slices/$arch"
            tar -C "$slices/$arch" -xf "$slices/KisakCOD-mp-app-$arch.tar"
          done
          arm="$slices/arm64/KisakCOD-mp.app"
          intel="$slices/x86_64/KisakCOD-mp.app"
          app="$RUNNER_TEMP/universal/KisakCOD-mp.app"
          mkdir -p "$RUNNER_TEMP/universal"
          cp -R "$arm" "$app"
          # The two bundles must hold the same files; each Mach-O becomes fat.
          diff <(cd "$arm" && find . -type f | sort) <(cd "$intel" && find . -type f | sort)
          merged=0
          while IFS= read -r file; do
            if lipo -archs "$arm/$file" >/dev/null 2>&1; then
              lipo -create "$arm/$file" "$intel/$file" -output "$app/$file"
              test "$(lipo -archs "$app/$file")" = "x86_64 arm64"
              merged=$((merged + 1))
            fi
          done < <(cd "$arm" && find . -type f -not -path './Contents/_CodeSignature/*')
          test "$merged" -eq 6
          for library in "$app"/Contents/Frameworks/*.dylib; do
            codesign --force --sign - "$library"
          done
          codesign --force --sign - "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          python3 -u scripts/tests/test_linux_mp_client.py --binary "$app/Contents/MacOS/KisakCOD-mp" --native-os macOS
          # The Intel slice too, when the runner has Rosetta 2.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            python3 -u scripts/tests/test_linux_mp_client.py --binary "$app/Contents/MacOS/KisakCOD-mp" \
              --native-os macOS --emulator "arch -x86_64"
          else
            echo "no Rosetta 2 on this runner; the x86_64 slice ran in its own client job"
          fi

      - name: Report the sizes
        shell: bash
        run: |
          set -euo pipefail
          bytes() { stat -f %z "$1"; }
          tree_bytes() { find "$1" -type f -exec stat -f %z {} + | awk '{s += $1} END {print s}'; }
          mib() { awk -v b="$1" 'BEGIN {printf "%.1f MiB", b / 1048576}'; }
          zip_bytes() {
            ditto -c -k --keepParent "$1" "$RUNNER_TEMP/measure.zip"
            bytes "$RUNNER_TEMP/measure.zip"
            rm -f "$RUNNER_TEMP/measure.zip"
          }
          stripped_bytes() {
            # strip -S -x drops the debug map and local symbols, as a release
            # would; on a copy, since it breaks the signature.
            rm -rf "$RUNNER_TEMP/stripped"
            mkdir -p "$RUNNER_TEMP/stripped"
            cp -R "$1" "$RUNNER_TEMP/stripped/"
            local copy="$RUNNER_TEMP/stripped/$(basename "$1")"
            while IFS= read -r file; do
              if lipo -archs "$file" >/dev/null 2>&1; then
                xcrun strip -S -x "$file" 2>/dev/null || true
              fi
            done < <(find "$copy" -type f)
            tree_bytes "$copy"
          }
          {
            echo "### KisakCOD-mp.app size (RelWithDebInfo, CI libraries, no game data)"
            echo
            echo "| Bundle | Executable | Whole bundle | Bundle, stripped | Bundle, zipped |"
            echo "|---|---|---|---|---|"
            for entry in "arm64:$RUNNER_TEMP/slices/arm64/KisakCOD-mp.app" \
                         "x86_64:$RUNNER_TEMP/slices/x86_64/KisakCOD-mp.app" \
                         "universal:$RUNNER_TEMP/universal/KisakCOD-mp.app"; do
              label="${entry%%:*}"
              app="${entry#*:}"
              echo "| $label | $(mib "$(bytes "$app/Contents/MacOS/KisakCOD-mp")") | $(mib "$(tree_bytes "$app")") | $(mib "$(stripped_bytes "$app")") | $(mib "$(zip_bytes "$app")") |"
            done
            echo
            echo "| File in the universal bundle | Size |"
            echo "|---|---|"
            app="$RUNNER_TEMP/universal/KisakCOD-mp.app"
            while IFS= read -r file; do
              echo "| ${file#$app/} | $(mib "$(bytes "$file")") |"
            done < <(find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f | sort)
          } | tee -a "$GITHUB_STEP_SUMMARY"

  vulkan_probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Step three (docs/macos.md): the Vulkan back end's own pieces, built with
    # -DKISAK_PLATFORM=macos against the pinned SDL3 and Homebrew's Vulkan
    # headers, loader and MoltenVK, then run in a Cocoa window by the same
    # checks the Linux lavapipe job runs: the window probe (the shared core),
    # the Legacy shader translator, the Legacy adapter's pixel check and the
    # check of its D3D9 front (docs/vulkan-d3d9-front.md), which compiles
    # against DXVK Native's headers (no DXVK library). Nothing of the engine is
    # compiled in and no game data is read.
    name: macOS ${{ matrix.arch }} Vulkan back end checks
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-26' || 'macos-15-intel' }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on pull requests; Intel Macs join after a merge and on
        # manual runs (docs/ci.md). GitHub runs five macOS jobs at a time.
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64"]' || '["arm64", "x86_64"]') }}

    env:
      SDL3_REVISION: 877399b2b2cf21e67554ed9046410f268ce1d1b2
      DXVK_REVISION: c3dd74be6baec53786d4e064a572185b70347a17
      DXVK_DIRECTX_HEADERS_REVISION: 9df86f2341616ef1888ae59919feaa6d4fad693d
      BUILD_DIR: build-macos/${{ matrix.arch }}-vulkan-probe
      OUT_DIR: ${{ github.workspace }}/out/macos-${{ matrix.arch }}-vulkan-probe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools, MoltenVK and the Vulkan loader
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          command -v ninja >/dev/null || brew install ninja
          # spirv-tools for spirv-val, which the shader translator's check runs.
          brew install vulkan-headers vulkan-loader molten-vk vulkan-validationlayers spirv-tools
          for formula in vulkan-headers vulkan-loader molten-vk vulkan-validationlayers spirv-tools; do
            echo "$formula $(brew list --versions "$formula")"
          done
          test -f "$(brew --prefix vulkan-headers)/include/vulkan/vulkan.h"
          test -f "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          system_profiler SPDisplaysDataType || true
          sw_vers

      - name: Restore pinned SDL3 SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SDL3-sdk
          key: sdl3-sdk-macos-${{ matrix.arch }}-${{ env.SDL3_REVISION }}-${{ hashFiles('.github/workflows/build-kisakcod-macos.yaml') }}

      - name: Build pinned SDL3 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # The same SDL3 commit and options as the client job (one cache).
          if [[ ! -f "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.0.dylib" ]]; then
            git init "$RUNNER_TEMP/SDL3-source"
            git -C "$RUNNER_TEMP/SDL3-source" remote add origin https://github.com/libsdl-org/SDL.git
            git -C "$RUNNER_TEMP/SDL3-source" fetch --depth 1 origin "$SDL3_REVISION"
            git -C "$RUNNER_TEMP/SDL3-source" checkout --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/SDL3-source" rev-parse HEAD)" = "$SDL3_REVISION"
            cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-sdk" -DCMAKE_INSTALL_LIBDIR=lib \
              -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF
            cmake --build "$RUNNER_TEMP/SDL3-build" --parallel "$(sysctl -n hw.ncpu)"
            cmake --install "$RUNNER_TEMP/SDL3-build"
          fi
          lipo -archs "$RUNNER_TEMP/SDL3-sdk/lib/libSDL3.0.dylib" | grep -qx "${{ matrix.arch }}"

      - name: Fetch pinned DXVK Native 2.7.1 headers
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Headers only, for the D3D9 front: the same source-only fetch as the
          # client job. Nothing of DXVK is built.
          src="$RUNNER_TEMP/dxvk-source"
          git init "$src"
          git -C "$src" remote add origin https://github.com/doitsujin/dxvk.git
          git -C "$src" fetch --depth 1 origin "$DXVK_REVISION"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$DXVK_REVISION"
          recorded="$(git -C "$src" ls-tree HEAD include/native/directx | awk '{print $3}')"
          test "$recorded" = "$DXVK_DIRECTX_HEADERS_REVISION"
          headers="$src/include/native/directx"
          git init "$headers"
          git -C "$headers" remote add origin https://github.com/Joshua-Ashton/mingw-directx-headers.git
          git -C "$headers" fetch --depth 1 origin "$DXVK_DIRECTX_HEADERS_REVISION"
          git -C "$headers" checkout --detach FETCH_HEAD
          test "$(git -C "$headers" rev-parse HEAD)" = "$DXVK_DIRECTX_HEADERS_REVISION"
          grep -q "version : '2.7.1'" "$src/meson.build"
          python3 scripts/tests/run_native_d3d9_boundary_checks.py \
            --dxvk-source "$src" --stage-dxvk-headers "$RUNNER_TEMP/dxvk-include/dxvk"

      - name: Build the Vulkan back end's checks
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DKISAK_PLATFORM=macos \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$OUT_DIR" \
            -DKISAK_BUILD_VULKAN_PROBE=ON -DKISAK_BUILD_VULKAN_SHADERS=ON \
            -DKISAK_BUILD_VULKAN_LEGACY=ON \
            -DKISAK_BUILD_LINUX_NATIVE_D3D9=ON \
            -DKISAK_DXVK_NATIVE_INCLUDE_DIR="$RUNNER_TEMP/dxvk-include/dxvk" \
            -DKISAK_VULKAN_INCLUDE_DIR="$(brew --prefix vulkan-headers)/include" \
            -DSDL3_DIR="$RUNNER_TEMP/SDL3-sdk/lib/cmake/SDL3"
          cmake --build "$BUILD_DIR" \
            --target KisakCOD-vulkan-probe KisakCOD-vulkan-shaders KisakCOD-vulkan-legacy-check \
            KisakCOD-vulkan-d3d9-check \
            --parallel "$(sysctl -n hw.ncpu)"
          for tool in KisakCOD-vulkan-probe KisakCOD-vulkan-legacy-check KisakCOD-vulkan-d3d9-check; do
            lipo -archs "$OUT_DIR/$tool" | grep -qx "${{ matrix.arch }}"
            otool -L "$OUT_DIR/$tool"
            # The loader is opened at run time through SDL, never linked, and
            # no D3D9 library is: the front is the D3D9 implementation. otool's
            # first line names the tool itself, so it is skipped.
            if otool -L "$OUT_DIR/$tool" | tail -n +2 | grep -Eqi 'vulkan|moltenvk|d3d9|dxvk'; then
              echo "$tool must not link the Vulkan loader, MoltenVK or a D3D9 library" >&2
              exit 1
            fi
          done

      - name: Check the Legacy shader translator
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # The shader spike's test shaders through dxbc-spirv and our
          # lowering, each result checked by spirv-val (docs/vulkan-legacy-shaders.md).
          python3 -u scripts/tests/test_vulkan_legacy_shaders.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-shaders"

      - name: Run the Vulkan window probe through MoltenVK
        timeout-minutes: 10
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # SDL and the loader find the loader and the validation layer by bare
          # name; the default search path does not include Homebrew's prefix on
          # Apple silicon. The probe finds SDL3 through its own rpath.
          export SDL_VULKAN_LIBRARY="$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            # The Intel runner is a VM whose paravirtualized Metal device aborts
            # when MoltenVK sizes Metal argument buffers while creating the
            # instance (inside -[MTLDevice newArgumentEncoderWithArguments:]).
            # Without argument buffers MoltenVK never asks.
            export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
          fi
          python3 -u scripts/tests/test_vulkan_window_probe.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-probe" \
            --video-driver cocoa --validation auto

      - name: Run the Legacy adapter check through MoltenVK
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # The same environment as the window probe's run above.
          export SDL_VULKAN_LIBRARY="$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
          fi
          # D3D9-style scenes drawn through the Legacy adapter and checked pixel
          # by pixel (docs/vulkan-legacy-adapter.md).
          python3 -u scripts/tests/test_vulkan_legacy_adapter.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-legacy-check" \
            --video-driver cocoa --validation auto

      - name: Run the D3D9 front check through MoltenVK
        timeout-minutes: 15
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          export SDL_VULKAN_LIBRARY="$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
          fi
          # The adapter driven through IDirect3D9 and IDirect3DDevice9, as the
          # renderer calls it (docs/vulkan-d3d9-front.md).
          python3 -u scripts/tests/test_vulkan_d3d9_front.py \
            --binary "$OUT_DIR/KisakCOD-vulkan-d3d9-check" \
            --video-driver cocoa --validation auto

      - name: Show where the probe stopped
        if: ${{ failure() }}
        timeout-minutes: 10
        shell: bash
        run: |
          # Diagnostics only: keep going past a crash (the step still fails).
          set +e -u
          export SDL_VULKAN_LIBRARY="$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:/usr/local/lib:/usr/lib"
          export SDL_VIDEODRIVER=cocoa
          export VK_LOADER_DEBUG=error,warn,driver
          export MVK_CONFIG_LOG_LEVEL=3
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            export MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0
          fi
          system_profiler SPDisplaysDataType
          "$OUT_DIR/KisakCOD-vulkan-probe" --list-devices --validation off
          echo "exit status $?"
          sudo DevToolsSecurity -enable || true
          lldb --batch -o run -k "thread backtrace all" -k quit \
            -- "$OUT_DIR/KisakCOD-vulkan-probe" --list-devices --validation off
          ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -n 5
          exit 1
